<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domaines</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0e13;color:#e6edf3;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:19px;margin:0 0 2px}.sub{font-size:12px;color:#8b98a5;margin:0 0 16px}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:640px){.dgrid{grid-template-columns:1fr}}
.dcard{background:#161b22;border:1px solid #232a33;border-left-width:4px;border-radius:14px;padding:18px;cursor:pointer;transition:.15s}
.dcard:hover{background:#1c232d;transform:translateY(-1px)}
.dcard .e{font-size:26px}.dcard .n{font-size:17px;font-weight:800;margin-top:6px}.dcard .t{font-size:11.5px;color:#8b98a5;margin-top:8px}
#viewer{position:fixed;inset:0;background:#0b0e13;display:none;flex-direction:column;z-index:5}
#vtop{display:flex;align-items:center;gap:12px;padding:9px 14px;background:#0e1116;border-bottom:1px solid #2a313c}
.back{font-family:inherit;font-size:13px;font-weight:700;background:#7c93ff;color:#0b0e13;border:none;border-radius:8px;padding:8px 14px;cursor:pointer}
#vttl{font-size:14px;font-weight:700}
#vframe{flex:1;border:0;width:100%;background:#0e1116}
/* bouton Signaler + formulaire */
#sig-btn{margin-left:auto;font-family:inherit;font-size:12.5px;font-weight:700;background:#12241a;color:#8ef0b6;border:1px solid #2f6b46;border-radius:9px;padding:8px 13px;cursor:pointer}
#sig-btn:hover{background:#173123}
#sig-panel{position:fixed;right:14px;bottom:14px;width:340px;max-width:calc(100% - 28px);background:#0e1116;border:1px solid #2f6b46;border-radius:14px;padding:14px;z-index:9;display:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#sig-panel h3{margin:0 0 2px;font-size:14px}#sig-panel .h{font-size:11px;color:#8b98a5;margin-bottom:10px}
#sig-panel label{display:block;font-size:11px;color:#9aa7b4;margin:8px 0 3px}
#sig-panel input,#sig-panel textarea,#sig-panel select{width:100%;background:#0b0f15;border:1px solid #2a313c;color:#e6edf3;border-radius:8px;padding:8px;font-family:inherit;font-size:13px}
#sig-panel .row{display:flex;gap:8px;margin-top:12px}
#sig-panel .send{flex:1;background:#12241a;color:#8ef0b6;border:1px solid #2f6b46;border-radius:8px;padding:9px;font-weight:700;cursor:pointer;font-family:inherit}
#sig-panel .cancel{background:transparent;color:#9aa7b4;border:1px solid #2a313c;border-radius:8px;padding:9px 12px;cursor:pointer;font-family:inherit}
#sig-ok{color:#8ef0b6;font-size:12px;margin-top:8px;min-height:15px}
</style></head>
<body>
<div class="wrap">
 <h1>🌐 Domaines</h1>
 <div class="sub">Choisis un domaine pour ouvrir son cockpit complet.</div>
 <div class="dgrid" id="grid"></div>
</div>
<div id="viewer">
 <div id="vtop">
   <button class="back" onclick="closeDom()">← Domaines</button>
   <span id="vttl"></span>
   <button id="sig-btn" onclick="openSig()">🎫 Signaler</button>
 </div>
 <iframe id="vframe" title="cockpit"></iframe>
</div>

<!-- formulaire de signalement -> crée un vrai ticket via le pont (index.html) -->
<div id="sig-panel">
 <h3>🎫 Signaler au responsable</h3>
 <div class="h" id="sig-ctx"></div>
 <label>Objet</label>
 <input id="sig-objet" maxlength="120" placeholder="Ex : Titre de séjour manquant — agent X">
 <label>Détail</label>
 <textarea id="sig-msg" rows="3" maxlength="600" placeholder="Décris ce qui manque / ce qu'il faut faire…"></textarea>
 <label>Destinataire</label>
 <select id="sig-pour">
  <option value="superviseur">Superviseur</option>
  <option value="admin">Administrateur</option>
  <option value="operateur">Opérateur</option>
  <option value="superadmin">Super-admin</option>
 </select>
 <div class="row"><button class="send" onclick="sendSig()">Envoyer</button><button class="cancel" onclick="closeSig()">Annuler</button></div>
 <div id="sig-ok"></div>
</div>

<script>
var DOMS=[
 {k:"FKH",   e:"🧭", c:"#7c93ff", t:"Cockpit complet · 31+ vues live", f:"APPLI_FKH.html"},
 {k:"GARIS", e:"🛡️", c:"#f0997b", t:"CA hors FKH · alerte Indy", f:"APPLI_GARIS.html"},
 {k:"DAHLIA",e:"🌸", c:"#f0abfc", t:"RSI · reconstruction CA", f:"APPLI_DAHLIA.html"},
 /* 2026-08-18 — PERSO N'EST PLUS PUBLIE. Sa page contenait des donnees de sante
    en clair dans un depot PUBLIC ; elle est sortie du suivi git et vit en local.
    Decision de Zeus le 18/08 : « on ne met pas les informations de PERSO pour le
    moment ». La tuile reste, mais elle le DIT au lieu d'ouvrir un 404 muet. */
 {k:"PERSO", e:"🧑", c:"#34d399", t:"Local uniquement — non publié", f:"APPLI_PERSO.html", local:true}
];
var curDom=null;
/* ===== b443 : L'ADMINISTRATEUR NE VOIT PAS PERSO — DU TOUT =====
   Zeus, 13/08 : l'admin n'a acces qu'a l'Administratif des TROIS societes. PERSO n'est pas une
   societe : ni ses depenses, ni sa sante, ni son juridique ne le regardent. La carte n'est donc
   pas grisee, elle n'est pas dessinee. Le role vient de l'appli GESTION (meme origine).
   HONNETE : c'est la SURFACE qu'on retire. Le vrai verrou reste le mot de passe cote GESTION —
   ouvrir APPLI_PERSO.html a la main resterait possible. Dit a Zeus le 13/08. */
var ROLE_DOM=null;
try{ var _m=/[?&]role=([a-z-]+)/.exec(location.search);
     ROLE_DOM=_m?_m[1]:(localStorage.getItem('fkh_role_domaines')||null); }catch(e){}
if(ROLE_DOM==='admin'){ DOMS=DOMS.filter(function(d){ return d.k!=='PERSO'; }); }
var grid=document.getElementById('grid');
DOMS.forEach(function(d){
 var el=document.createElement('div');
 el.className='dcard'; el.style.borderLeftColor=d.c;
 el.innerHTML='<div class="e">'+d.e+'</div><div class="n" style="color:'+d.c+'">'+d.k+'</div><div class="t">'+d.t+'</div>';
 el.onclick=function(){openDom(d);};
 grid.appendChild(el);
});
function openDom(d){
 curDom=d;
 document.getElementById('vttl').innerHTML='<span style="color:'+d.c+'">'+d.e+' '+d.k+'</span>';
 /* b443 : le cockpit doit connaitre le role AVANT de dessiner ses onglets — on le lui donne
    dans son URL en plus du stockage, pour qu'il n'ait rien a reclamer. */
 if(d.local){
    /* 2026-08-18 — pas de page en ligne pour ce domaine : on l'annonce, on ne
       laisse pas le navigateur afficher un 404 que personne ne saurait lire. */
    document.getElementById('vframe').removeAttribute('src');
    document.getElementById('vframe').srcdoc='<!doctype html><meta charset=utf-8>'
      +'<div style="font:15px/1.6 system-ui;padding:40px;max-width:620px;margin:auto;color:#334">'
      +'<h2 style="margin:0 0 14px">🧑 PERSO — consultable en local seulement</h2>'
      +'<p>Ce domaine <b>n\'est pas publié en ligne</b>. Sa page contenait des données '
      +'personnelles (santé, dépenses) et ce dépôt est public : elle a été retirée le 18/08.</p>'
      +'<p>Elle reste complète sur l\'ordinateur, dans '
      +'<code>fkh-web\\gestion\\domaines\\APPLI_PERSO.html</code>.</p>'
      +'<p style="color:#889;font-size:13px">Décision de Zeus, 18/08 — voir G-134.</p></div>';
  } else {
    document.getElementById('vframe').removeAttribute('srcdoc');
    document.getElementById('vframe').src=d.f+(ROLE_DOM?('?role='+encodeURIComponent(ROLE_DOM)):'');
  }
 document.getElementById('viewer').style.display='flex';
}
function closeDom(){
 closeSig();
 document.getElementById('viewer').style.display='none';
 document.getElementById('vframe').src='about:blank';
 curDom=null;
}
/* --- Signalement : crée un vrai ticket via le pont posé dans index.html --- */
function openSig(){
 if(!curDom)return;
 document.getElementById('sig-ctx').textContent='Domaine : '+curDom.k+' — crée un ticket adressé à un responsable.';
 document.getElementById('sig-ok').textContent='';
 document.getElementById('sig-panel').style.display='block';
 document.getElementById('sig-objet').focus();
}
function closeSig(){ document.getElementById('sig-panel').style.display='none'; }
function sendSig(){
 var objet=(document.getElementById('sig-objet').value||'').trim();
 if(!objet){ document.getElementById('sig-ok').textContent='⚠️ Mets au moins un objet.'; return; }
 var msg=(document.getElementById('sig-msg').value||'').trim();
 var pour=document.getElementById('sig-pour').value;
 var k=curDom?curDom.k:'Domaines';
 var payload={
   objet: objet,
   message: msg,
   pour: pour,
   source: '🌐 Domaines · '+k,
   contexte: ['Cockpit '+k],
   ref: k+':'+objet.slice(0,40)
 };
 // le pont vit dans index.html = parent direct de ce hub
 try{ parent.postMessage({fkh:1, action:'ticket.create', payload:payload}, location.origin); }catch(e){}
 document.getElementById('sig-ok').textContent='✅ Ticket envoyé au '+pour+'.';
 document.getElementById('sig-objet').value=''; document.getElementById('sig-msg').value='';
 setTimeout(closeSig, 1200);
}

/* ===== 12/08 : LE DÉPÔT PART DE L'ENDROIT, PAS DU FICHIER =====
   Une vue de 🌐 Domaines sait déjà CE QUI manque et OÙ ça va — domaine, casier,
   mois, tiers. Elle demande ici l'ouverture du sélecteur ; la clé de dépôt est
   calculée depuis ce contexte, jamais devinée depuis le fichier.

   Ce pont vit dans hub.html et NON dans index.html : ce dernier est écrit par
   une autre session, et deux sessions sur un même fichier se défont. Le hub est
   chargé en iframe dès l'ouverture, de même origine : il peut écouter la fenêtre
   parente et appeler ses fonctions. Rien à changer chez le voisin.

   La porte est celle de b411 : on refuse tout ce qui ne vient pas de notre origine. */
(function(){
  var top_ = (function(){ try{ return window.parent && window.parent!==window ? window.parent : window; }catch(e){ return window; } })();
  if(top_.__pontDepot) return; top_.__pontDepot = 1;

  function propre(t){ return String(t==null?'':t)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60); }

  function toast(m, ok){
    var d=document.createElement('div');
    d.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;'
      +'padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;max-width:90%;'
      +'box-shadow:0 8px 30px rgba(0,0,0,.5);white-space:pre-line;'
      +(ok?'background:#12241a;color:#8ef0b6;border:1px solid #2f6b46'
          :'background:#2a1416;color:#ffb4b0;border:1px solid #6b2f2f');
    d.textContent=m; document.body.appendChild(d);
    setTimeout(function(){ try{document.body.removeChild(d);}catch(e){} }, 5000);
  }

  top_.addEventListener('message', function(e){
    if(e.origin!==location.origin) return;
    var d=e.data||{}; if(d.fkh!==1 || d.action!=='depot.attach') return;
    var p=d.payload||{};
    var dom=propre(p.domaine||'FKH'), casier=propre(p.casier||'_A_CLASSER');
    var mois=propre(p.mois||''), tiers=propre(p.tiers||''), nature=propre(p.nature||'PIECE');

    var up = top_.fkhUpload, pret = top_.fkhPret;
    if(typeof up!=='function' || typeof pret!=='function' || !pret()){
      toast('Connexion en ligne requise pour déposer un fichier.', false); return; }

    var inp=document.createElement('input');
    inp.type='file'; inp.style.display='none'; document.body.appendChild(inp);
    inp.onchange=function(){
      var f=this.files&&this.files[0];
      try{ document.body.removeChild(inp); }catch(_e){}
      if(!f) return;
      if(f.size>15*1024*1024){ toast('Fichier trop lourd (15 Mo max).', false); return; }
      var ext=(f.name.match(/\.[A-Za-z0-9]{1,6}$/)||[''])[0].toLowerCase();
      var nom=[mois,nature,tiers].filter(Boolean).join('_')+ext;
      var cle='depot/'+dom+'/'+casier+'/'+(mois||'sans-date')+'/'+nom;
      toast('Envoi de « '+f.name+' »…', true);
      up(cle, f, function(j){
        if(!(j&&j.ok)){ toast("Le fichier n'a pas pu être envoyé.", false); return; }
        /* Un dépôt sans trace est un dépôt qu'on croit fait : il ouvre un ticket. */
        try{ top_.postMessage({fkh:1, action:'ticket.create', payload:{
          objet:'📎 Déposé : '+nature+' '+tiers+' ('+(mois||'sans date')+')',
          message:'Fichier « '+f.name+' » déposé depuis '+(p.source||'Domaines')+'.\n'
                 +'Clé : '+cle+'\nÀ ranger en local dans le dossier du domaine '+dom+'.',
          pour:'admin', source:'📎 Dépôt', contexte:['Dépôt '+dom, casier, cle],
          ref:dom+':depot:'+nom }}, location.origin); }catch(_e){}
        toast('✅ Déposé — '+cle+'\nIl sera rangé dans le dossier local au prochain passage.', true);
      });
    };
    inp.click();
  });
})();

</script>
</body></html>
