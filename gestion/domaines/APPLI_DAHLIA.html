function showV(v){document.querySelectorAll('.vframe').forEach(f=>f.style.display='none');var el=document.getElementById('if-'+v);if(el){el.style.display='block';var ask=function(){try{el.contentWindow.postMessage({__ask:1},'*')}catch(e){}};ask();setTimeout(ask,150);setTimeout(ask,450);}document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));window.scrollTo(0,0);}
let lastCmd="";
function showCmd(t){lastCmd=t;document.getElementById('cmdtxt').textContent=t;document.getElementById('cmdbar').style.display='flex';}
function copyCmd(){var ok=false;try{var ta=document.createElement('textarea');ta.value=lastCmd;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){}if(!ok){try{navigator.clipboard.writeText(lastCmd)}catch(e){}}var b=event.target;var o=b.textContent;b.textContent=ok?'Copié ✓':'sélectionne le texte ci-contre';setTimeout(()=>b.textContent=o,1600);}
window.addEventListener('message',function(e){var d=e.data||{};
 if(d.__cmd){var c=d.__cmd.trim();if(MAP[c]!==undefined){showV(MAP[c]);}else{showCmd(c);}}
 if(d.__id){var f=document.getElementById('if-'+d.__id);if(f&&d.__h){f.style.height=(d.__h+4)+'px';}}
});

/* ---------- CARNET : la coque lit DATA_DAHLIA.json UNE fois et le diffuse aux vues ---------- */
var SRV="Google Drive", CARNET=null, CERR=null, CAT=null, CSRC=null;
var badge=document.getElementById('carnet');
function cPost(w){try{w.postMessage({__data:CARNET,__err:CERR,__at:CAT,__src:CSRC},'*')}catch(e){}}
function cDiffuse(){document.querySelectorAll('.vframe').forEach(function(f){if(f.contentWindow)cPost(f.contentWindow)});}
function cBadge(){
  if(!badge)return;
  /* 12/08 : quatre etats. « ✓ » tout court ne suffisait pas — un instantane embarque
     s'affichait en vert avec l'heure courante, et rien ne disait que RIEN n'avait ete lu. */
  if(CARNET&&(CSRC==='fichier'||CSRC==='drive')){badge.className='carnet on';
    badge.textContent='carnet ✓ '+(CSRC==='fichier'?'fichier ':'Drive ')+(CAT?new Date(CAT).toLocaleTimeString('fr-FR'):'');
    badge.title='DATA_DAHLIA.json lu '+(CSRC==='fichier'?'à côté du cockpit':'sur le Drive')+' et diffusé à toutes les vues';}
  else if(CARNET){badge.className='carnet ko';
    badge.textContent='carnet ○ instantané embarqué';
    badge.title='Aucune lecture du fichier dans cette session'+(CERR?' ('+CERR+')':'')+
      ' — les chiffres viennent de l’instantané figé dans la page.';}
  else{badge.className='carnet ko';badge.textContent='carnet — figé';
    badge.title='Chiffres figés : '+(CERR||'?');}
}
/* Le repli : on montre l'instantane PLUTOT QUE RIEN, mais on le dit. */
function cRepli(code){
  if(window.__CARNET_DEMO__){CARNET=window.__CARNET_DEMO__;CSRC='snapshot';CERR=code||null;CAT=null;}
  else{CARNET=null;CSRC=null;CERR=code;CAT=null;}
  cBadge();cDiffuse();
}
function cFail(code){if(code==='server_unavailable'&&CARNET&&CSRC==='drive')return;cRepli(code);}
function cOk(d,at,src){CARNET=d;CSRC=src||'drive';CERR=null;CAT=at;cBadge();cDiffuse();}
function cParse(txt){
  if(typeof txt!=="string") return (txt&&txt.domaine)?txt:null;
  try{ return JSON.parse(txt); }catch(e){}
  try{ return JSON.parse(txt.replace(/\\([^"\\\/bfnrtu])/g,"$1")); }catch(e){}
  var i=txt.indexOf("{"), j=txt.lastIndexOf("}");
  if(i>=0&&j>i){ try{ return JSON.parse(txt.slice(i,j+1).replace(/\\([^"\\\/bfnrtu])/g,"$1")); }catch(e){} }
  return null;
}
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.__want==='data'&&e.source){cPost(e.source);return;}
  if(d.__mcp&&e.source){
    var q=d.__mcp, src=e.source;
    if(!window.claude||window.claude.mcp===undefined){
      try{src.postMessage({__mcperr:{id:q.id,code:'capability_disabled'}},'*')}catch(_){}
      return;
    }
    window.claude.mcp.callTool(SRV,q.tool,q.input,{cache:{staleTime:120000}})
      .then(function(r){try{src.postMessage({__mcpres:{id:q.id,payload:r.payload}},'*')}catch(_){}})
      .catch(function(er){try{src.postMessage({__mcperr:{id:q.id,code:(er&&er.code)||'upstream_error'}},'*')}catch(_){}});
  }
});
/* ORDRE DE LECTURE — 12/08, sur constat de Zeus : « les cockpits doivent refléter
   l'état actuel du dossier ». Ils ne le pouvaient pas.
     1. DATA_DAHLIA.json posé À CÔTÉ du cockpit — même origine, un simple fetch. Marche
        partout : dans l'appli GESTION sur GitHub Pages comme en local.
     2. le Drive via window.claude.mcp — n'existe QUE dans un artefact Claude. C'était
        l'UNIQUE chemin jusqu'ici, donc dans l'appli le cockpit tombait systématiquement
        sur capability_disabled et n'était jamais vivant nulle part.
     3. l'instantané embarqué, en repli, annoncé comme tel.
   L'instantané ne court-circuite plus rien : il s'affiche tout de suite pour ne pas
   laisser un écran vide, et se fait remplacer dès que le fichier répond. */
/* 2026-08-13, demande de Zeus : « que la vue lise le carnet DÈS qu'il y en a un
   nouveau ». La coque REPASSE donc demander le fichier toutes les 60 s, page
   ouverte. Elle ne rediffuse aux vues QUE si le texte a changé (comparaison du
   contenu, pas de l'heure) : un veilleur qui régénère à l'identique ne fait pas
   clignoter les vues, un carnet vraiment neuf les rafraîchit sans rechargement. */
var cTxtPrec=null;
function cFichier(rejoue){
  try{
    fetch('DATA_DAHLIA.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){
        if(rejoue&&t===cTxtPrec) return;          /* rien de neuf : silence */
        var d=cParse(t); if(!d) throw 0;
        cTxtPrec=t; cOk(d, Date.now(), 'fichier');
      })
      .catch(function(){ if(!rejoue) cDrive(); });
  }catch(e){ if(!rejoue) cDrive(); }
}
setInterval(function(){ cFichier(true); },60000);
function cDrive(){
  if(!window.claude||window.claude.mcp===undefined){ cRepli('capability_disabled'); return; }
  window.claude.mcp.watchTool(SRV,"search_files",
    {query:"title contains 'DATA_DAHLIA'",pageSize:5,excludeContentSnippets:true},
    function(ev){
      if(ev.type==='error'){ cFail((ev.error&&ev.error.code)||'upstream_error'); return; }
      var p=ev.result&&ev.result.payload;
      var fs=(p&&p.files)||[];
      // pas d'outil "update" Drive -> une MAJ = nouveau fichier même titre. On prend le PLUS RÉCENT (newest-wins).
      var f=fs.slice().sort(function(a,b){return (b.modifiedTime||'').localeCompare(a.modifiedTime||'');})[0];
      if(!f){ cFail('__absent'); return; }
      window.claude.mcp.callTool(SRV,"read_file_content",{fileId:f.id},{cache:{staleTime:60000}})
        .then(function(res){
          var pp=res.payload, txt=(pp&&(pp.fileContent||pp.content))||pp;
          var dd=cParse(txt);
          if(!dd){ cFail('__illisible'); return; }
          cOk(dd, res.cache?res.cache.storedAt:Date.now());
        })
        .catch(function(er){ cFail((er&&er.code)||'upstream_error'); });
    },
    {refetchInterval:600000});
}
cRepli('__lecture');   /* de quoi afficher tout de suite, remplacé dès que le fichier répond */
cFichier();
