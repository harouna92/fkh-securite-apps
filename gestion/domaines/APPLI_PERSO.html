 var MOIS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
 /* Les vues ne partagent pas un vocabulaire de classes : cette liste a été relevée dans

 /* b444 : `.cd` — les tuiles de CA. Sans lui, elles traversaient le filtre. */

 function css(){

 function pubLire(){ try{ var a=JSON.parse(localStorage.getItem(PUBCLE)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }

 function libelle(el){
  var t='';
  if(el.tagName==='TR' &amp;&amp; el.cells &amp;&amp; el.cells.length>=2) t=el.cells[0].textContent;
  else { var h=el.querySelector('b,strong,h1,h2,h3,h4,.tit,.mno,.kl,.k'); t=h?h.textContent:el.textContent; }
  /* On retire les ornements que les vues ajoutent autour du libellé (pastille d'état,

     autonome (ÉTAT) a publiée — et le miroir masquerait justement ce qu'il doit montrer. */
  t=String(t||'').replace(/[\u{1F441}●○⊕⏱▸▾✎]/gu,'').replace(/\s+/g,' ').trim();

 var PLAFOND=250, tronque=0;
 function candidats(){

 /* Le STYLE de la vue voyage avec le bloc (demande de Zeus 13/08 : « je veux que les

  var j=d.querySelectorAll('.oeilg,.oeilp,.oeilpub,#oeilg-tronque');
  for(var i=0;i<j.length;i++){ if(j[i].parentNode) j[i].parentNode.removeChild(j[i]); }
  return '<!DOCTYPE html>'+d.outerHTML;
 }
 function appliqueMiroir(){
  if(!MIROIR) return;
  var garde={}, i;
  for(i=0;i<MIROIR.length;i++) garde[MIROIR[i]]=1;
  var c=candidats();
  for(i=0;i<c.length;i++) c[i].el.style.display = garde[c[i].cle] ? '' : 'none';

      recevraient un œil, et on ne saurait plus lequel on publie. */

 function css(){

 function libelle(el){
  var t='';
  if(el.tagName==='TR' &amp;&amp; el.cells &amp;&amp; el.cells.length>=2) t=el.cells[0].textContent;
  else { var h=el.querySelector('b,strong,h1,h2,h3,h4,.tit,.mno,.kl,.k'); t=h?h.textContent:el.textContent; }
  /* On retire les ornements que les vues ajoutent autour du libellé (pastille d'état,
     loupe, horloge, chevrons, l'œil lui-même). Ils ne font pas partie du nom du bloc :
     si on les gardait, la clé calculée ici ne correspondrait plus à celle qu'une vue
     autonome (ÉTAT) a publiée — et le miroir masquerait justement ce qu'il doit montrer. */
  t=String(t||'').replace(/[\u{1F441}●○⊕⏱▸▾✎]/gu,'').replace(/\s+/g,' ').trim();
  return t.slice(0,90);

 var PLAFOND=250, tronque=0;
 function candidats(){
  var out=[], vus={}, els=document.querySelectorAll(SEL); tronque=0;
  for(var i=0;i<els.length;i++){
   var el=els[i];
   if(el.querySelector('table')) continue;            /* un conteneur n'est pas un bloc */
   if(el.getAttribute&amp;&amp;el.getAttribute('data-nopub')) continue;
   /* On garde le bloc le PLUS EXTÉRIEUR : sans ça une carte et chacune de ses lignes
      recevraient un œil, et on ne saurait plus lequel on publie. */
   var p=el.parentElement, imbrique=false;
   while(p &amp;&amp; p!==document.body){ if(p.matches&amp;&amp;p.matches(SEL)){ imbrique=true; break; } p=p.parentElement; }
   if(imbrique) continue;

   var k=lab, n=2; while(vus[k]){ k=lab+' #'+n; n++; }

 function etatCase(t){
  if(t.indexOf('✗')>=0) return 2;
  if(t.indexOf('\u{1F532}')>=0) return 0;
  if(t.indexOf('⏳')>=0) return 4;
  if(t===''||t==='—'||t==='·') return 3;

 function nettoie(el){
  var c=el.cloneNode(true), i, j;
  var jeter=c.querySelectorAll('script,style,.oeilg,.oeilp,.oeilpub');
  for(i=0;i<jeter.length;i++){ if(jeter[i].parentNode) jeter[i].parentNode.removeChild(jeter[i]); }

   for(j=a.length-1;j>=0;j--){ if(/^on/i.test(a[j].name)) tous[i].removeAttribute(a[j].name); } }

  if(el.tagName==='TR') h='<table style=&quot;width:100%;border-collapse:collapse;font-size:11.5px&quot;>'+h+'</table>';
  return h.slice(0,20000);

 /* Le STYLE de la vue voyage avec le bloc (demande de Zeus 13/08 : « je veux que les
    informations s'affichent de la même manière dans Administratif que dans les vues
    d'origine »). Sans lui, le même HTML rendu ailleurs change d'allure — et un tableau
    qu'on ne reconnaît pas oblige à relire au lieu de regarder. */
 function styles(){
  var out='', ss=document.querySelectorAll('style');
  for(var i=0;i<ss.length;i++){ if(ss[i].id==='oeilg-css') continue; out+=ss[i].textContent+'\n'; }

 function servir(cle){

  if(!t) return null;

 function bascule(cle){

 function oeils(){

  travaille=true;                    /* poser l'œil modifie le DOM : on ne se réveille pas soi-même */
  try{
   var c=candidats();
   for(var i=0;i<c.length;i++){

    var o=null, kids=hote.children;
    for(var k=0;k<kids.length;k++){ if(kids[k].className&amp;&amp;String(kids[k].className).indexOf('oeilg')===0) o=kids[k]; }
    if(window.__ROLE__==='admin'){ if(o&amp;&amp;o.parentNode) o.parentNode.removeChild(o); continue; }
    if(!o){ o=document.createElement('span'); o.textContent='\u{1F441}';
      (function(cle){ o.addEventListener('click',function(ev){ ev.stopPropagation(); ev.preventDefault(); bascule(cle); }); })(c[i].cle);
      hote.appendChild(o); }
    var on=estPublie(c[i].cle);

   }

     av.style.cssText='position:sticky;bottom:24px;z-index:98;margin:8px 0 0;padding:5px 10px;'
      +'font:11px/1.5 ui-monospace,Menlo,monospace;color:#fbbf24;border:1px solid #5a4a1e;border-radius:7px;background:#1a1508';
     document.body.appendChild(av); }
    av.textContent='\u{1F441} '+PLAFOND+' blocs publiables affichés sur '+(PLAFOND+tronque)

  }catch(e){}

 /* ---- LE MIROIR (Zeus 13/08) ------------------------------------------------------
    « Au lieu de copier là où je mets l'œil, mets-le en miroir. » Cette vue sait donc
    envoyer SA PAGE ENTIÈRE, qu'Administratif ré-instancie telle quelle. L'exemplaire
    ainsi ouvert reçoit la liste des blocs à garder et masque tout le reste : identique
    par construction, et vivant — ses propres scripts tournent, ses clics marchent.
    On ne recopie donc plus ni HTML ni style, et il n'y a plus rien à « reproduire ». */
 function copieDeLaVue(){
  var d=document.documentElement.cloneNode(true);
  var j=d.querySelectorAll('.oeilg,.oeilp,.oeilpub,#oeilg-tronque');
  for(var i=0;i<j.length;i++){ if(j[i].parentNode) j[i].parentNode.removeChild(j[i]); }
  return '<!DOCTYPE html>'+d.outerHTML;
 }
 function appliqueMiroir(){
  if(!MIROIR) return;
  var garde={}, i;
  for(i=0;i<MIROIR.length;i++) garde[MIROIR[i]]=1;
  var c=candidats();
  for(i=0;i<c.length;i++) c[i].el.style.display = garde[c[i].cle] ? '' : 'none';
  var o=document.querySelectorAll('.oeilg,.oeilp,.oeilpub');     /* un miroir ne publie pas */
  for(i=0;i<o.length;i++){ if(o[i].parentNode) o[i].parentNode.removeChild(o[i]); }
  hauteur();
 }
 function hauteur(){
  try{ parent.postMessage({__miroirH:document.documentElement.scrollHeight||document.body.scrollHeight},'*'); }catch(_){}
 }
 /* Un miroir doit vivre : le carnet le fait grandir, le drill le fait s'ouvrir. On
    remesure à chaque changement plutôt que de figer une hauteur à l'ouverture. */
 function surveilleMiroir(){
  try{ new MutationObserver(function(){ if(MIROIR){ appliqueMiroir(); } }).observe(document.body,{subtree:true,childList:true,attributes:true}); }catch(e){}
  document.addEventListener('click',function(){ setTimeout(hauteur,60); setTimeout(hauteur,300); });
  window.addEventListener('load',function(){ hauteur(); setTimeout(hauteur,300); setTimeout(hauteur,900); });
  setTimeout(hauteur,400); setTimeout(hauteur,1200);
 }

 /* La vue ne connaît pas son identifiant : elle le demande à sa fenêtre parente. Tant

  var d=e.data||{};

     ses blocs lui-même mais n'a pas de raison de refuser son propre reflet. */

   try{ e.source.postMessage({__vueres:{id:d.__vueask.id, vue:VUEID, html:copieDeLaVue()}},'*'); }catch(_){}

  if(d.__miroir){ MIROIR=d.__miroir.cles||[]; appliqueMiroir(); return; }

  if(VUEID==='admin') return;                  /* la vue qui affiche ne se publie pas elle-même */

(function(){
 if(window.__BLOC_GEN__) return; window.__BLOC_GEN__=1;
 var PUBCLE=&quot;fkh_admin_pub_PERSO&quot;, DOMN=&quot;PERSO&quot;;
 var VUEID=null, VUELABEL=null, PUBCARNET=[], travaille=false, minuteur=null, MIROIR=null;
 var MOIS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
 /* Les vues ne partagent pas un vocabulaire de classes : cette liste a été relevée dans
    les vues réelles (PILOTAGE construit .grp/.cs à l'exécution, Mouvements .cat/.lg…).
    On ne devine pas : ce qui n'est pas là ne reçoit pas d'œil, et ça se voit. */
 /* b444 : `.cd` — les tuiles de CA. Sans lui, elles traversaient le filtre. */
 var SEL='table tr, .row, .kpi, .card, .cat, .pub, .bloc, .item, .grp, .cs, .cd, .tuile, .box, .lg';

 function css(){
  if(document.getElementById('oeilg-css')) return;
  var s=document.createElement('style'); s.id='oeilg-css';
  s.textContent='.oeilg{cursor:pointer;font-size:11.5px;margin-left:6px;padding:1px 5px;border-radius:6px;'
   +'border:1px solid #2a313c;opacity:.75;filter:grayscale(1);display:inline-block;line-height:1.35;'
   +'vertical-align:middle;transition:opacity .12s,border-color .12s}'
   +'.oeilg:hover{opacity:1;filter:none;border-color:#7c93ff;background:rgba(124,147,255,.12)}'
   +'.oeilg.on{opacity:1;filter:none;border-color:#7c93ff;background:rgba(124,147,255,.18)}';
  (document.head||document.body).appendChild(s);
 }
 function pubLire(){ try{ var a=JSON.parse(localStorage.getItem(PUBCLE)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
 function pubEcrire(a){ try{ localStorage.setItem(PUBCLE,JSON.stringify(a)); }catch(e){} }
 /* Le poste dès qu'il s'est exprimé (clé présente, même vide), sinon le carnet : sur un
    autre navigateur, les œils doivent refléter ce qui est réellement publié. */
 function pubBase(){ try{ if(localStorage.getItem(PUBCLE)!==null) return pubLire(); }catch(e){} return PUBCARNET.slice(); }
 function idDe(cle){ return VUEID+'|'+cle; }
 function estPublie(cle){ var a=pubBase(); for(var i=0;i<a.length;i++){ if(a[i].id===idDe(cle)) return true; } return false; }

 function libelle(el){
  var t='';
  if(el.tagName==='TR' &amp;&amp; el.cells &amp;&amp; el.cells.length>=2) t=el.cells[0].textContent;
  else { var h=el.querySelector('b,strong,h1,h2,h3,h4,.tit,.mno,.kl,.k'); t=h?h.textContent:el.textContent; }
  /* On retire les ornements que les vues ajoutent autour du libellé (pastille d'état,
     loupe, horloge, chevrons, l'œil lui-même). Ils ne font pas partie du nom du bloc :
     si on les gardait, la clé calculée ici ne correspondrait plus à celle qu'une vue
     autonome (ÉTAT) a publiée — et le miroir masquerait justement ce qu'il doit montrer. */
  t=String(t||'').replace(/[\u{1F441}●○⊕⏱▸▾✎]/gu,'').replace(/\s+/g,' ').trim();
  return t.slice(0,90);
 }
 var PLAFOND=250, tronque=0;
 function candidats(){
  var out=[], vus={}, els=document.querySelectorAll(SEL); tronque=0;
  for(var i=0;i<els.length;i++){
   var el=els[i];
   if(el.querySelector('table')) continue;            /* un conteneur n'est pas un bloc */
   if(el.getAttribute&amp;&amp;el.getAttribute('data-nopub')) continue;
   /* On garde le bloc le PLUS EXTÉRIEUR : sans ça une carte et chacune de ses lignes
      recevraient un œil, et on ne saurait plus lequel on publie. */
   var p=el.parentElement, imbrique=false;
   while(p &amp;&amp; p!==document.body){ if(p.matches&amp;&amp;p.matches(SEL)){ imbrique=true; break; } p=p.parentElement; }
   if(imbrique) continue;
   var lab=libelle(el);
   if(!lab || lab.length<2) continue;
   if(out.length>=PLAFOND){ tronque++; continue; }    /* borné, mais JAMAIS en silence */
   var k=lab, n=2; while(vus[k]){ k=lab+' #'+n; n++; }
   vus[k]=1; out.push({el:el, cle:k});
  }
  return out;
 }
 function etatCase(t){
  if(t.indexOf('✗')>=0) return 2;
  if(t.indexOf('\u{1F532}')>=0) return 0;
  if(t.indexOf('⏳')>=0) return 4;
  if(t===''||t==='—'||t==='·') return 3;
  return 1;
 }
 function nettoie(el){
  var c=el.cloneNode(true), i, j;
  var jeter=c.querySelectorAll('script,style,.oeilg,.oeilp,.oeilpub');
  for(i=0;i<jeter.length;i++){ if(jeter[i].parentNode) jeter[i].parentNode.removeChild(jeter[i]); }
  var tous=[c].concat([].slice.call(c.querySelectorAll('*')));
  for(i=0;i<tous.length;i++){ var a=tous[i].attributes; if(!a) continue;
   for(j=a.length-1;j>=0;j--){ if(/^on/i.test(a[j].name)) tous[i].removeAttribute(a[j].name); } }
  var h=c.outerHTML;
  if(el.tagName==='TR') h='<table style=&quot;width:100%;border-collapse:collapse;font-size:11.5px&quot;>'+h+'</table>';
  return h.slice(0,20000);
 }
 /* Le STYLE de la vue voyage avec le bloc (demande de Zeus 13/08 : « je veux que les
    informations s'affichent de la même manière dans Administratif que dans les vues
    d'origine »). Sans lui, le même HTML rendu ailleurs change d'allure — et un tableau
    qu'on ne reconnaît pas oblige à relire au lieu de regarder. */
 function styles(){
  var out='', ss=document.querySelectorAll('style');
  for(var i=0;i<ss.length;i++){ if(ss[i].id==='oeilg-css') continue; out+=ss[i].textContent+'\n'; }
  return out.slice(0,60000);
 }
 function servir(cle){
  var c=candidats(), t=null;
  for(var i=0;i<c.length;i++){ if(c[i].cle===cle) t=c[i]; }
  if(!t) return null;
  var el=t.el, h=nettoie(el), css=styles();
  if(el.tagName==='TR' &amp;&amp; el.cells &amp;&amp; el.cells.length===13){
   var d=[],v=[];
   for(var j=1;j<=12;j++){ var x=(el.cells[j].textContent||'').trim(); v.push(etatCase(x)); d.push(x==='·'?'':x); }
   return {type:'grid', cle:cle, mois:MOIS, d:d, v:v, html:h, css:css};
  }
  return {type:'html', cle:cle, html:h, css:css};
 }
 function pret(){ var m={__blocpret:{vue:VUEID}};
  try{ parent.postMessage(m,'*'); }catch(_){}
  try{ var fr=parent.frames; for(var i=0;i<fr.length;i++){ if(fr[i]!==window) fr[i].postMessage(m,'*'); } }catch(_){} }
 function bascule(cle){
  var a=pubBase(), id=idDe(cle), pos=-1;
  for(var i=0;i<a.length;i++){ if(a[i].id===id) pos=i; }
  if(pos>=0) a.splice(pos,1);
  else a.push({id:id, vue:VUEID, vue_label:VUELABEL||VUEID, cle:cle,
               publie_le:new Date().toISOString(), par:'Zeus'});
  pubEcrire(a);
  try{ if(typeof window.__pubSync==='function') window.__pubSync(a); }catch(_){}
  var m={__pubchange:{dom:DOMN}};
  try{ parent.postMessage(m,'*'); }catch(_){}
  try{ var fr=parent.frames; for(var j=0;j<fr.length;j++){ if(fr[j]!==window) fr[j].postMessage(m,'*'); } }catch(_){}
  oeils();
 }
 function oeils(){
  if(!VUEID || travaille) return;
  travaille=true;                    /* poser l'œil modifie le DOM : on ne se réveille pas soi-même */
  try{
   var c=candidats();
   for(var i=0;i<c.length;i++){
    var el=c[i].el, hote=(el.tagName==='TR'&amp;&amp;el.cells.length)?el.cells[0]:el;
    var o=null, kids=hote.children;
    for(var k=0;k<kids.length;k++){ if(kids[k].className&amp;&amp;String(kids[k].className).indexOf('oeilg')===0) o=kids[k]; }
    if(window.__ROLE__==='admin'){ if(o&amp;&amp;o.parentNode) o.parentNode.removeChild(o); continue; }
    if(!o){ o=document.createElement('span'); o.textContent='\u{1F441}';
      (function(cle){ o.addEventListener('click',function(ev){ ev.stopPropagation(); ev.preventDefault(); bascule(cle); }); })(c[i].cle);
      hote.appendChild(o); }
    var on=estPublie(c[i].cle);
    o.className='oeilg'+(on?' on':'');
    o.title=on?'Publié dans Administratif — cliquer pour retirer':'Publier ce bloc dans Administratif';
   }
   /* Un plafond atteint sans le dire ferait croire que tout est publiable. On l'avoue
      dans la vue elle-même, là où Zeus le verra au moment de choisir. */
   var av=document.getElementById('oeilg-tronque');
   if(tronque>0){
    if(!av){ av=document.createElement('div'); av.id='oeilg-tronque';
     av.style.cssText='position:sticky;bottom:24px;z-index:98;margin:8px 0 0;padding:5px 10px;'
      +'font:11px/1.5 ui-monospace,Menlo,monospace;color:#fbbf24;border:1px solid #5a4a1e;border-radius:7px;background:#1a1508';
     document.body.appendChild(av); }
    av.textContent='\u{1F441} '+PLAFOND+' blocs publiables affichés sur '+(PLAFOND+tronque)
      +' — les '+tronque+' derniers n\'ont pas d\'œil (limite de la vue, dis-le si tu en as besoin).';
   } else if(av &amp;&amp; av.parentNode){ av.parentNode.removeChild(av); }
  }catch(e){}
  travaille=false;
 }
 function replanifie(){ if(minuteur) clearTimeout(minuteur); minuteur=setTimeout(function(){ oeils(); pret(); },500); }

 function demarre(){
  css(); oeils(); pret();
  window.addEventListener('message',function(e){
   var d=e.data||{};
   if(d.__blocask){ var q=d.__blocask, s=servir(q.cle);
    var rep=s?{id:q.id, ok:true, vue:VUEID, cle:s.cle, type:s.type, mois:s.mois, d:s.d, v:s.v, html:s.html, css:s.css}
             :{id:q.id, ok:false, vue:VUEID, cle:q.cle, motif:'bloc introuvable dans la vue '+(VUELABEL||VUEID)};
    try{ e.source.postMessage({__blocres:rep},'*'); }catch(_){} }
   if(d.__bloclist){ try{ e.source.postMessage({__bloclistres:{id:d.__bloclist.id, vue:VUEID,
     cles:candidats().map(function(x){return x.cle;})}},'*'); }catch(_){} }
   if(d.__pubchange) oeils();
  });
  if(window.CARNET) window.CARNET.onData(function(s){
   var b=s&amp;&amp;s.data&amp;&amp;s.data.administratif_publications;
   PUBCARNET=Array.isArray(b)?b:[];
   replanifie();
  });
  if(typeof window.__onRole!=='function') window.__onRole=function(){ oeils(); };
  try{ new MutationObserver(replanifie).observe(document.body,{subtree:true,childList:true}); }catch(e){}
 }

 /* ---- LE MIROIR (Zeus 13/08) ------------------------------------------------------
    « Au lieu de copier là où je mets l'œil, mets-le en miroir. » Cette vue sait donc
    envoyer SA PAGE ENTIÈRE, qu'Administratif ré-instancie telle quelle. L'exemplaire
    ainsi ouvert reçoit la liste des blocs à garder et masque tout le reste : identique
    par construction, et vivant — ses propres scripts tournent, ses clics marchent.
    On ne recopie donc plus ni HTML ni style, et il n'y a plus rien à « reproduire ». */
 function copieDeLaVue(){
  var d=document.documentElement.cloneNode(true);
  var j=d.querySelectorAll('.oeilg,.oeilp,.oeilpub,#oeilg-tronque');
  for(var i=0;i<j.length;i++){ if(j[i].parentNode) j[i].parentNode.removeChild(j[i]); }
  return '<!DOCTYPE html>'+d.outerHTML;
 }
 function appliqueMiroir(){
  if(!MIROIR) return;
  var garde={}, i;
  for(i=0;i<MIROIR.length;i++) garde[MIROIR[i]]=1;
  var c=candidats();
  for(i=0;i<c.length;i++) c[i].el.style.display = garde[c[i].cle] ? '' : 'none';
  var o=document.querySelectorAll('.oeilg,.oeilp,.oeilpub');     /* un miroir ne publie pas */
  for(i=0;i<o.length;i++){ if(o[i].parentNode) o[i].parentNode.removeChild(o[i]); }
  hauteur();
 }
 function hauteur(){
  try{ parent.postMessage({__miroirH:document.documentElement.scrollHeight||document.body.scrollHeight},'*'); }catch(_){}
 }
 /* Un miroir doit vivre : le carnet le fait grandir, le drill le fait s'ouvrir. On
    remesure à chaque changement plutôt que de figer une hauteur à l'ouverture. */
 function surveilleMiroir(){
  try{ new MutationObserver(function(){ if(MIROIR){ appliqueMiroir(); } }).observe(document.body,{subtree:true,childList:true,attributes:true}); }catch(e){}
  document.addEventListener('click',function(){ setTimeout(hauteur,60); setTimeout(hauteur,300); });
  window.addEventListener('load',function(){ hauteur(); setTimeout(hauteur,300); setTimeout(hauteur,900); });
  setTimeout(hauteur,400); setTimeout(hauteur,1200);
 }

 /* La vue ne connaît pas son identifiant : elle le demande à sa fenêtre parente. Tant
    qu'elle ne l'a pas, elle ne peut désigner aucun bloc — on n'installe rien avant. */
 window.addEventListener('message',function(e){
  var d=e.data||{};
  /* servir sa page à qui veut l'afficher en miroir — y compris pour ÉTAT, qui gère
     ses blocs lui-même mais n'a pas de raison de refuser son propre reflet. */
  if(d.__vueask&amp;&amp;e.source){
   try{ e.source.postMessage({__vueres:{id:d.__vueask.id, vue:VUEID, html:copieDeLaVue()}},'*'); }catch(_){}
   return;
  }
  if(d.__miroir){ MIROIR=d.__miroir.cles||[]; appliqueMiroir(); return; }
  if(d.__vueid===undefined || VUEID) return;
  VUEID=d.__vueid; VUELABEL=d.__vuelabel||d.__vueid;
  if(d.__miroircles){                          /* on est un reflet, pas la vue de travail */
   MIROIR=d.__miroircles; appliqueMiroir(); surveilleMiroir(); return;
  }
  if(VUEID==='admin') return;                  /* la vue qui affiche ne se publie pas elle-même */
  if(typeof window.__blocPret==='function') return;   /* vue déjà autonome (ÉTAT) : on s'efface */
  demarre();
 });
 function qui(){ try{ parent.postMessage({__whoami:1},'*'); }catch(_){} }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',qui); else qui();

(function(){
 if(window.__BLOC_GEN__) return; window.__BLOC_GEN__=1;
 var PUBCLE=&quot;fkh_admin_pub_PERSO&quot;, DOMN=&quot;PERSO&quot;;
 var VUEID=null, VUELABEL=null, PUBCARNET=[], travaille=false, minuteur=null, MIROIR=null;
 var MOIS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
 /* Les vues ne partagent pas un vocabulaire de classes : cette liste a été relevée dans
    les vues réelles (PILOTAGE construit .grp/.cs à l'exécution, Mouvements .cat/.lg…).
    On ne devine pas : ce qui n'est pas là ne reçoit pas d'œil, et ça se voit. */
 /* b444 : `.cd` — les tuiles de CA. Sans lui, elles traversaient le filtre. */
 var SEL='table tr, .row, .kpi, .card, .cat, .pub, .bloc, .item, .grp, .cs, .cd, .tuile, .box, .lg';

 function css(){
  if(document.getElementById('oeilg-css')) return;
  var s=document.createElement('style'); s.id='oeilg-css';
  s.textContent='.oeilg{cursor:pointer;font-size:11.5px;margin-left:6px;padding:1px 5px;border-radius:6px;'
   +'border:1px solid #2a313c;opacity:.75;filter:grayscale(1);display:inline-block;line-height:1.35;'
   +'vertical-align:middle;transition:opacity .12s,border-color .12s}'
   +'.oeilg:hover{opacity:1;filter:none;border-color:#7c93ff;background:rgba(124,147,255,.12)}'
   +'.oeilg.on{opacity:1;filter:none;border-color:#7c93ff;background:rgba(124,147,255,.18)}';
  (document.head||document.body).appendChild(s);
 }
 function pubLire(){ try{ var a=JSON.parse(localStorage.getItem(PUBCLE)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
 function pubEcrire(a){ try{ localStorage.setItem(PUBCLE,JSON.stringify(a)); }catch(e){} }
 /* Le poste dès qu'il s'est exprimé (clé présente, même vide), sinon le carnet : sur un
    autre navigateur, les œils doivent refléter ce qui est réellement publié. */
 function pubBase(){ try{ if(localStorage.getItem(PUBCLE)!==null) return pubLire(); }catch(e){} return PUBCARNET.slice(); }
 function idDe(cle){ return VUEID+'|'+cle; }
 function estPublie(cle){ var a=pubBase(); for(var i=0;i<a.length;i++){ if(a[i].id===idDe(cle)) return true; } return false; }

 function libelle(el){
  var t='';
  if(el.tagName==='TR' &amp;&amp; el.cells &amp;&amp; el.cells.length>=2) t=el.cells[0].textContent;
  else { var h=el.querySelector('b,strong,h1,h2,h3,h4,.tit,.mno,.kl,.k'); t=h?h.textContent:el.textContent; }
  /* On retire les ornements que les vues ajoutent autour du libellé (pastille d'état,
     loupe, horloge, chevrons, l'œil lui-même). Ils ne font pas partie du nom du bloc :
     si on les gardait, la clé calculée ici ne correspondrait plus à celle qu'une vue
     autonome (ÉTAT) a publiée — et le miroir masquerait justement ce qu'il doit montrer. */
  t=String(t||'').replace(/[\u{1F441}●○⊕⏱▸▾✎]/gu,'').replace(/\s+/g,' ').trim();
  return t.slice(0,90);
 }
 var PLAFOND=250, tronque=0;
 function candidats(){
  var out=[], vus={}, els=document.querySelectorAll(SEL); tronque=0;
  for(var i=0;i<els.length;i++){
   var el=els[i];
   if(el.querySelector('table')) continue;            /* un conteneur n'est pas un bloc */
   if(el.getAttribute&amp;&amp;el.getAttribute('data-nopub')) continue;
   /* On garde le bloc le PLUS EXTÉRIEUR : sans ça une carte et chacune de ses lignes
      recevraient un œil, et on ne saurait plus lequel on publie. */
   var p=el.parentElement, imbrique=false;
   while(p &amp;&amp; p!==document.body){ if(p.matches&amp;&amp;p.matches(SEL)){ imbrique=true; break; } p=p.parentElement; }
   if(imbrique) continue;
   var lab=libelle(el);
   if(!lab || lab.length<2) continue;
   if(out.length>=PLAFOND){ tronque++; continue; }    /* borné, mais JAMAIS en silence */
   var k=lab, n=2; while(vus[k]){ k=lab+' #'+n; n++; }
   vus[k]=1; out.push({el:el, cle:k});
  }
  return out;
 }
 function etatCase(t){
  if(t.indexOf('✗')>=0) return 2;
  if(t.indexOf('\u{1F532}')>=0) return 0;
  if(t.indexOf('⏳')>=0) return 4;
  if(t===''||t==='—'||t==='·') return 3;
  return 1;
 }
 function nettoie(el){
  var c=el.cloneNode(true), i, j;
  var jeter=c.querySelectorAll('script,style,.oeilg,.oeilp,.oeilpub');
  for(i=0;i<jeter.length;i++){ if(jeter[i].parentNode) jeter[i].parentNode.removeChild(jeter[i]); }
  var tous=[c].concat([].slice.call(c.querySelectorAll('*')));
  for(i=0;i<tous.length;i++){ var a=tous[i].attributes; if(!a) continue;
   for(j=a.length-1;j>=0;j--){ if(/^on/i.test(a[j].name)) tous[i].removeAttribute(a[j].name); } }
  var h=c.outerHTML;
  if(el.tagName==='TR') h='<table style=&quot;width:100%;border-collapse:collapse;font-size:11.5px&quot;>'+h+'</table>';
  return h.slice(0,20000);
 }
 /* Le STYLE de la vue voyage avec le bloc (demande de Zeus 13/08 : « je veux que les
    informations s'affichent de la même manière dans Administratif que dans les vues
    d'origine »). Sans lui, le même HTML rendu ailleurs change d'allure — et un tableau
    qu'on ne reconnaît pas oblige à relire au lieu de regarder. */
 function styles(){
  var out='', ss=document.querySelectorAll('style');
  for(var i=0;i<ss.length;i++){ if(ss[i].id==='oeilg-css') continue; out+=ss[i].textContent+'\n'; }
  return out.slice(0,60000);
 }
 function servir(cle){
  var c=candidats(), t=null;
  for(var i=0;i<c.length;i++){ if(c[i].cle===cle) t=c[i]; }
  if(!t) return null;
  var el=t.el, h=nettoie(el), css=styles();
  if(el.tagName==='TR' &amp;&amp; el.cells &amp;&amp; el.cells.length===13){
   var d=[],v=[];
   for(var j=1;j<=12;j++){ var x=(el.cells[j].textContent||'').trim(); v.push(etatCase(x)); d.push(x==='·'?'':x); }
   return {type:'grid', cle:cle, mois:MOIS, d:d, v:v, html:h, css:css};
  }
  return {type:'html', cle:cle, html:h, css:css};
 }
 function pret(){ var m={__blocpret:{vue:VUEID}};
  try{ parent.postMessage(m,'*'); }catch(_){}
  try{ var fr=parent.frames; for(var i=0;i<fr.length;i++){ if(fr[i]!==window) fr[i].postMessage(m,'*'); } }catch(_){} }
 function bascule(cle){
  var a=pubBase(), id=idDe(cle), pos=-1;
  for(var i=0;i<a.length;i++){ if(a[i].id===id) pos=i; }
  if(pos>=0) a.splice(pos,1);
  else a.push({id:id, vue:VUEID, vue_label:VUELABEL||VUEID, cle:cle,
               publie_le:new Date().toISOString(), par:'Zeus'});
  pubEcrire(a);
  try{ if(typeof window.__pubSync==='function') window.__pubSync(a); }catch(_){}
  var m={__pubchange:{dom:DOMN}};
  try{ parent.postMessage(m,'*'); }catch(_){}
  try{ var fr=parent.frames; for(var j=0;j<fr.length;j++){ if(fr[j]!==window) fr[j].postMessage(m,'*'); } }catch(_){}
  oeils();
 }
 function oeils(){
  if(!VUEID || travaille) return;
  travaille=true;                    /* poser l'œil modifie le DOM : on ne se réveille pas soi-même */
  try{
   var c=candidats();
   for(var i=0;i<c.length;i++){
    var el=c[i].el, hote=(el.tagName==='TR'&amp;&amp;el.cells.length)?el.cells[0]:el;
    var o=null, kids=hote.children;
    for(var k=0;k<kids.length;k++){ if(kids[k].className&amp;&amp;String(kids[k].className).indexOf('oeilg')===0) o=kids[k]; }
    if(window.__ROLE__==='admin'){ if(o&amp;&amp;o.parentNode) o.parentNode.removeChild(o); continue; }
    if(!o){ o=document.createElement('span'); o.textContent='\u{1F441}';
      (function(cle){ o.addEventListener('click',function(ev){ ev.stopPropagation(); ev.preventDefault(); bascule(cle); }); })(c[i].cle);
      hote.appendChild(o); }
    var on=estPublie(c[i].cle);
    o.className='oeilg'+(on?' on':'');
    o.title=on?'Publié dans Administratif — cliquer pour retirer':'Publier ce bloc dans Administratif';
   }
   /* Un plafond atteint sans le dire ferait croire que tout est publiable. On l'avoue
      dans la vue elle-même, là où Zeus le verra au moment de choisir. */
   var av=document.getElementById('oeilg-tronque');
   if(tronque>0){
    if(!av){ av=document.createElement('div'); av.id='oeilg-tronque';
     av.style.cssText='position:sticky;bottom:24px;z-index:98;margin:8px 0 0;padding:5px 10px;'
      +'font:11px/1.5 ui-monospace,Menlo,monospace;color:#fbbf24;border:1px solid #5a4a1e;border-radius:7px;background:#1a1508';
     document.body.appendChild(av); }
    av.textContent='\u{1F441} '+PLAFOND+' blocs publiables affichés sur '+(PLAFOND+tronque)
      +' — les '+tronque+' derniers n\'ont pas d\'œil (limite de la vue, dis-le si tu en as besoin).';
   } else if(av &amp;&amp; av.parentNode){ av.parentNode.removeChild(av); }
  }catch(e){}
  travaille=false;
 }
 function replanifie(){ if(minuteur) clearTimeout(minuteur); minuteur=setTimeout(function(){ oeils(); pret(); },500); }

 function demarre(){
  css(); oeils(); pret();
  window.addEventListener('message',function(e){
   var d=e.data||{};
   if(d.__blocask){ var q=d.__blocask, s=servir(q.cle);
    var rep=s?{id:q.id, ok:true, vue:VUEID, cle:s.cle, type:s.type, mois:s.mois, d:s.d, v:s.v, html:s.html, css:s.css}
             :{id:q.id, ok:false, vue:VUEID, cle:q.cle, motif:'bloc introuvable dans la vue '+(VUELABEL||VUEID)};
    try{ e.source.postMessage({__blocres:rep},'*'); }catch(_){} }
   if(d.__bloclist){ try{ e.source.postMessage({__bloclistres:{id:d.__bloclist.id, vue:VUEID,
     cles:candidats().map(function(x){return x.cle;})}},'*'); }catch(_){} }
   if(d.__pubchange) oeils();
  });
  if(window.CARNET) window.CARNET.onData(function(s){
   var b=s&amp;&amp;s.data&amp;&amp;s.data.administratif_publications;
   PUBCARNET=Array.isArray(b)?b:[];
   replanifie();
  });
  if(typeof window.__onRole!=='function') window.__onRole=function(){ oeils(); };
  try{ new MutationObserver(replanifie).observe(document.body,{subtree:true,childList:true}); }catch(e){}
 }

 /* ---- LE MIROIR (Zeus 13/08) ------------------------------------------------------
    « Au lieu de copier là où je mets l'œil, mets-le en miroir. » Cette vue sait donc
    envoyer SA PAGE ENTIÈRE, qu'Administratif ré-instancie telle quelle. L'exemplaire
    ainsi ouvert reçoit la liste des blocs à garder et masque tout le reste : identique
    par construction, et vivant — ses propres scripts tournent, ses clics marchent.
    On ne recopie donc plus ni HTML ni style, et il n'y a plus rien à « reproduire ». */
 function copieDeLaVue(){
  var d=document.documentElement.cloneNode(true);
  var j=d.querySelectorAll('.oeilg,.oeilp,.oeilpub,#oeilg-tronque');
  for(var i=0;i<j.length;i++){ if(j[i].parentNode) j[i].parentNode.removeChild(j[i]); }
  return '<!DOCTYPE html>'+d.outerHTML;
 }
 function appliqueMiroir(){
  if(!MIROIR) return;
  var garde={}, i;
  for(i=0;i<MIROIR.length;i++) garde[MIROIR[i]]=1;
  var c=candidats();
  for(i=0;i<c.length;i++) c[i].el.style.display = garde[c[i].cle] ? '' : 'none';
  var o=document.querySelectorAll('.oeilg,.oeilp,.oeilpub');     /* un miroir ne publie pas */
  for(i=0;i<o.length;i++){ if(o[i].parentNode) o[i].parentNode.removeChild(o[i]); }
  hauteur();
 }
 function hauteur(){
  try{ parent.postMessage({__miroirH:document.documentElement.scrollHeight||document.body.scrollHeight},'*'); }catch(_){}
 }
 /* Un miroir doit vivre : le carnet le fait grandir, le drill le fait s'ouvrir. On
    remesure à chaque changement plutôt que de figer une hauteur à l'ouverture. */
 function surveilleMiroir(){
  try{ new MutationObserver(function(){ if(MIROIR){ appliqueMiroir(); } }).observe(document.body,{subtree:true,childList:true,attributes:true}); }catch(e){}
  document.addEventListener('click',function(){ setTimeout(hauteur,60); setTimeout(hauteur,300); });
  window.addEventListener('load',function(){ hauteur(); setTimeout(hauteur,300); setTimeout(hauteur,900); });
  setTimeout(hauteur,400); setTimeout(hauteur,1200);
 }

 /* La vue ne connaît pas son identifiant : elle le demande à sa fenêtre parente. Tant
    qu'elle ne l'a pas, elle ne peut désigner aucun bloc — on n'installe rien avant. */
 window.addEventListener('message',function(e){
  var d=e.data||{};
  /* servir sa page à qui veut l'afficher en miroir — y compris pour ÉTAT, qui gère
     ses blocs lui-même mais n'a pas de raison de refuser son propre reflet. */
  if(d.__vueask&amp;&amp;e.source){
   try{ e.source.postMessage({__vueres:{id:d.__vueask.id, vue:VUEID, html:copieDeLaVue()}},'*'); }catch(_){}
   return;
  }
  if(d.__miroir){ MIROIR=d.__miroir.cles||[]; appliqueMiroir(); return; }
  if(d.__vueid===undefined || VUEID) return;
  VUEID=d.__vueid; VUELABEL=d.__vuelabel||d.__vueid;
  if(d.__miroircles){                          /* on est un reflet, pas la vue de travail */
   MIROIR=d.__miroircles; appliqueMiroir(); surveilleMiroir(); return;
  }
  if(VUEID==='admin') return;                  /* la vue qui affiche ne se publie pas elle-même */
  if(typeof window.__blocPret==='function') return;   /* vue déjà autonome (ÉTAT) : on s'efface */
  demarre();
 });
 function qui(){ try{ parent.postMessage({__whoami:1},'*'); }catch(_){} }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',qui); else qui();

(function(){
 if(window.__BLOC_GEN__) return; window.__BLOC_GEN__=1;
 var PUBCLE=&quot;fkh_admin_pub_PERSO&quot;, DOMN=&quot;PERSO&quot;;
 var VUEID=null, VUELABEL=null, PUBCARNET=[], travaille=false, minuteur=null, MIROIR=null;
 var MOIS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
 /* Les vues ne partagent pas un vocabulaire de classes : cette liste a été relevée dans
    les vues réelles (PILOTAGE construit .grp/.cs à l'exécution, Mouvements .cat/.lg…).
    On ne devine pas : ce qui n'est pas là ne reçoit pas d'œil, et ça se voit. */
 /* b444 : `.cd` — les tuiles de CA. Sans lui, elles traversaient le filtre. */
 var SEL='table tr, .row, .kpi, .card, .cat, .pub, .bloc, .item, .grp, .cs, .cd, .tuile, .box, .lg';

 function css(){
  if(document.getElementById('oeilg-css')) return;
  var s=document.createElement('style'); s.id='oeilg-css';
  s.textContent='.oeilg{cursor:pointer;font-size:11.5px;margin-left:6px;padding:1px 5px;border-radius:6px;'
   +'border:1px solid #2a313c;opacity:.75;filter:grayscale(1);display:inline-block;line-height:1.35;'
   +'vertical-align:middle;transition:opacity .12s,border-color .12s}'
   +'.oeilg:hover{opacity:1;filter:none;border-color:#7c93ff;background:rgba(124,147,255,.12)}'
   +'.oeilg.on{opacity:1;filter:none;border-color:#7c93ff;background:rgba(124,147,255,.18)}';
  (document.head||document.body).appendChild(s);
 }
 function pubLire(){ try{ var a=JSON.parse(localStorage.getItem(PUBCLE)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
 function pubEcrire(a){ try{ localStorage.setItem(PUBCLE,JSON.stringify(a)); }catch(e){} }
 /* Le poste dès qu'il s'est exprimé (clé présente, même vide), sinon le carnet : sur un
    autre navigateur, les œils doivent refléter ce qui est réellement publié. */
 function pubBase(){ try{ if(localStorage.getItem(PUBCLE)!==null) return pubLire(); }catch(e){} return PUBCARNET.slice(); }
 function idDe(cle){ return VUEID+'|'+cle; }
 function estPublie(cle){ var a=pubBase(); for(var i=0;i<a.length;i++){ if(a[i].id===idDe(cle)) return true; } return false; }

 function libelle(el){
  var t='';
  if(el.tagName==='TR' &amp;&amp; el.cells &amp;&amp; el.cells.length>=2) t=el.cells[0].textContent;
  else { var h=el.querySelector('b,strong,h1,h2,h3,h4,.tit,.mno,.kl,.k'); t=h?h.textContent:el.textContent; }
  /* On retire les ornements que les vues ajoutent autour du libellé (pastille d'état,
     loupe, horloge, chevrons, l'œil lui-même). Ils ne font pas partie du nom du bloc :
     si on les gardait, la clé calculée ici ne correspondrait plus à celle qu'une vue
     autonome (ÉTAT) a publiée — et le miroir masquerait justement ce qu'il doit montrer. */
  t=String(t||'').replace(/[\u{1F441}●○⊕⏱▸▾✎]/gu,'').replace(/\s+/g,' ').trim();
  return t.slice(0,90);
 }
 var PLAFOND=250, tronque=0;
 function candidats(){
  var out=[], vus={}, els=document.querySelectorAll(SEL); tronque=0;
  for(var i=0;i<els.length;i++){
   var el=els[i];
   if(el.querySelector('table')) continue;            /* un conteneur n'est pas un bloc */
   if(el.getAttribute&amp;&amp;el.getAttribute('data-nopub')) continue;
   /* On garde le bloc le PLUS EXTÉRIEUR : sans ça une carte et chacune de ses lignes
      recevraient un œil, et on ne saurait plus lequel on publie. */
   var p=el.parentElement, imbrique=false;
   while(p &amp;&amp; p!==document.body){ if(p.matches&amp;&amp;p.matches(SEL)){ imbrique=true; break; } p=p.parentElement; }
   if(imbrique) continue;
   var lab=libelle(el);
   if(!lab || lab.length<2) continue;
   if(out.length>=PLAFOND){ tronque++; continue; }    /* borné, mais JAMAIS en silence */
   var k=lab, n=2; while(vus[k]){ k=lab+' #'+n; n++; }
   vus[k]=1; out.push({el:el, cle:k});
  }
  return out;
 }
 function etatCase(t){
  if(t.indexOf('✗')>=0) return 2;
  if(t.indexOf('\u{1F532}')>=0) return 0;
  if(t.indexOf('⏳')>=0) return 4;
  if(t===''||t==='—'||t==='·') return 3;
  return 1;
 }
 function nettoie(el){
  var c=el.cloneNode(true), i, j;
  var jeter=c.querySelectorAll('script,style,.oeilg,.oeilp,.oeilpub');
  for(i=0;i<jeter.length;i++){ if(jeter[i].parentNode) jeter[i].parentNode.removeChild(jeter[i]); }
  var tous=[c].concat([].slice.call(c.querySelectorAll('*')));
  for(i=0;i<tous.length;i++){ var a=tous[i].attributes; if(!a) continue;
   for(j=a.length-1;j>=0;j--){ if(/^on/i.test(a[j].name)) tous[i].removeAttribute(a[j].name); } }
  var h=c.outerHTML;
  if(el.tagName==='TR') h='<table style=&quot;width:100%;border-collapse:collapse;font-size:11.5px&quot;>'+h+'</table>';
  return h.slice(0,20000);
 }
 /* Le STYLE de la vue voyage avec le bloc (demande de Zeus 13/08 : « je veux que les
    informations s'affichent de la même manière dans Administratif que dans les vues
    d'origine »). Sans lui, le même HTML rendu ailleurs change d'allure — et un tableau
    qu'on ne reconnaît pas oblige à relire au lieu de regarder. */
 function styles(){
  var out='', ss=document.querySelectorAll('style');
  for(var i=0;i<ss.length;i++){ if(ss[i].id==='oeilg-css') continue; out+=ss[i].textContent+'\n'; }
  return out.slice(0,60000);
 }
 function servir(cle){
  var c=candidats(), t=null;
  for(var i=0;i<c.length;i++){ if(c[i].cle===cle) t=c[i]; }
  if(!t) return null;
  var el=t.el, h=nettoie(el), css=styles();
  if(el.tagName==='TR' &amp;&amp; el.cells &amp;&amp; el.cells.length===13){
   var d=[],v=[];
   for(var j=1;j<=12;j++){ var x=(el.cells[j].textContent||'').trim(); v.push(etatCase(x)); d.push(x==='·'?'':x); }
   return {type:'grid', cle:cle, mois:MOIS, d:d, v:v, html:h, css:css};
  }
  return {type:'html', cle:cle, html:h, css:css};
 }
 function pret(){ var m={__blocpret:{vue:VUEID}};
  try{ parent.postMessage(m,'*'); }catch(_){}
  try{ var fr=parent.frames; for(var i=0;i<fr.length;i++){ if(fr[i]!==window) fr[i].postMessage(m,'*'); } }catch(_){} }
 function bascule(cle){
  var a=pubBase(), id=idDe(cle), pos=-1;
  for(var i=0;i<a.length;i++){ if(a[i].id===id) pos=i; }
  if(pos>=0) a.splice(pos,1);
  else a.push({id:id, vue:VUEID, vue_label:VUELABEL||VUEID, cle:cle,
               publie_le:new Date().toISOString(), par:'Zeus'});
  pubEcrire(a);
  try{ if(typeof window.__pubSync==='function') window.__pubSync(a); }catch(_){}
  var m={__pubchange:{dom:DOMN}};
  try{ parent.postMessage(m,'*'); }catch(_){}
  try{ var fr=parent.frames; for(var j=0;j<fr.length;j++){ if(fr[j]!==window) fr[j].postMessage(m,'*'); } }catch(_){}
  oeils();
 }
 function oeils(){
  if(!VUEID || travaille) return;
  travaille=true;                    /* poser l'œil modifie le DOM : on ne se réveille pas soi-même */
  try{
   var c=candidats();
   for(var i=0;i<c.length;i++){
    var el=c[i].el, hote=(el.tagName==='TR'&amp;&amp;el.cells.length)?el.cells[0]:el;
    var o=null, kids=hote.children;
    for(var k=0;k<kids.length;k++){ if(kids[k].className&amp;&amp;String(kids[k].className).indexOf('oeilg')===0) o=kids[k]; }
    if(window.__ROLE__==='admin'){ if(o&amp;&amp;o.parentNode) o.parentNode.removeChild(o); continue; }
    if(!o){ o=document.createElement('span'); o.textContent='\u{1F441}';
      (function(cle){ o.addEventListener('click',function(ev){ ev.stopPropagation(); ev.preventDefault(); bascule(cle); }); })(c[i].cle);
      hote.appendChild(o); }
    var on=estPublie(c[i].cle);
    o.className='oeilg'+(on?' on':'');
    o.title=on?'Publié dans Administratif — cliquer pour retirer':'Publier ce bloc dans Administratif';
   }
   /* Un plafond atteint sans le dire ferait croire que tout est publiable. On l'avoue
      dans la vue elle-même, là où Zeus le verra au moment de choisir. */
   var av=document.getElementById('oeilg-tronque');
   if(tronque>0){
    if(!av){ av=document.createElement('div'); av.id='oeilg-tronque';
     av.style.cssText='position:sticky;bottom:24px;z-index:98;margin:8px 0 0;padding:5px 10px;'
      +'font:11px/1.5 ui-monospace,Menlo,monospace;color:#fbbf24;border:1px solid #5a4a1e;border-radius:7px;background:#1a1508';
     document.body.appendChild(av); }
    av.textContent='\u{1F441} '+PLAFOND+' blocs publiables affichés sur '+(PLAFOND+tronque)
      +' — les '+tronque+' derniers n\'ont pas d\'œil (limite de la vue, dis-le si tu en as besoin).';
   } else if(av &amp;&amp; av.parentNode){ av.parentNode.removeChild(av); }
  }catch(e){}
  travaille=false;
 }
 function replanifie(){ if(minuteur) clearTimeout(minuteur); minuteur=setTimeout(function(){ oeils(); pret(); },500); }

 function demarre(){
  css(); oeils(); pret();
  window.addEventListener('message',function(e){
   var d=e.data||{};
   if(d.__blocask){ var q=d.__blocask, s=servir(q.cle);
    var rep=s?{id:q.id, ok:true, vue:VUEID, cle:s.cle, type:s.type, mois:s.mois, d:s.d, v:s.v, html:s.html, css:s.css}
             :{id:q.id, ok:false, vue:VUEID, cle:q.cle, motif:'bloc introuvable dans la vue '+(VUELABEL||VUEID)};
    try{ e.source.postMessage({__blocres:rep},'*'); }catch(_){} }
   if(d.__bloclist){ try{ e.source.postMessage({__bloclistres:{id:d.__bloclist.id, vue:VUEID,
     cles:candidats().map(function(x){return x.cle;})}},'*'); }catch(_){} }
   if(d.__pubchange) oeils();
  });
  if(window.CARNET) window.CARNET.onData(function(s){
   var b=s&amp;&amp;s.data&amp;&amp;s.data.administratif_publications;
   PUBCARNET=Array.isArray(b)?b:[];
   replanifie();
  });
  if(typeof window.__onRole!=='function') window.__onRole=function(){ oeils(); };
  try{ new MutationObserver(replanifie).observe(document.body,{subtree:true,childList:true}); }catch(e){}
 }

 /* ---- LE MIROIR (Zeus 13/08) ------------------------------------------------------
    « Au lieu de copier là où je mets l'œil, mets-le en miroir. » Cette vue sait donc
    envoyer SA PAGE ENTIÈRE, qu'Administratif ré-instancie telle quelle. L'exemplaire
    ainsi ouvert reçoit la liste des blocs à garder et masque tout le reste : identique
    par construction, et vivant — ses propres scripts tournent, ses clics marchent.
    On ne recopie donc plus ni HTML ni style, et il n'y a plus rien à « reproduire ». */
 function copieDeLaVue(){
  var d=document.documentElement.cloneNode(true);
  var j=d.querySelectorAll('.oeilg,.oeilp,.oeilpub,#oeilg-tronque');
  for(var i=0;i<j.length;i++){ if(j[i].parentNode) j[i].parentNode.removeChild(j[i]); }
  return '<!DOCTYPE html>'+d.outerHTML;
 }
 function appliqueMiroir(){
  if(!MIROIR) return;
  var garde={}, i;
  for(i=0;i<MIROIR.length;i++) garde[MIROIR[i]]=1;
  var c=candidats();
  for(i=0;i<c.length;i++) c[i].el.style.display = garde[c[i].cle] ? '' : 'none';
  var o=document.querySelectorAll('.oeilg,.oeilp,.oeilpub');     /* un miroir ne publie pas */
  for(i=0;i<o.length;i++){ if(o[i].parentNode) o[i].parentNode.removeChild(o[i]); }
  hauteur();
 }
 function hauteur(){
  try{ parent.postMessage({__miroirH:document.documentElement.scrollHeight||document.body.scrollHeight},'*'); }catch(_){}
 }
 /* Un miroir doit vivre : le carnet le fait grandir, le drill le fait s'ouvrir. On
    remesure à chaque changement plutôt que de figer une hauteur à l'ouverture. */
 function surveilleMiroir(){
  try{ new MutationObserver(function(){ if(MIROIR){ appliqueMiroir(); } }).observe(document.body,{subtree:true,childList:true,attributes:true}); }catch(e){}
  document.addEventListener('click',function(){ setTimeout(hauteur,60); setTimeout(hauteur,300); });
  window.addEventListener('load',function(){ hauteur(); setTimeout(hauteur,300); setTimeout(hauteur,900); });
  setTimeout(hauteur,400); setTimeout(hauteur,1200);
 }

 /* La vue ne connaît pas son identifiant : elle le demande à sa fenêtre parente. Tant
    qu'elle ne l'a pas, elle ne peut désigner aucun bloc — on n'installe rien avant. */
 window.addEventListener('message',function(e){
  var d=e.data||{};
  /* servir sa page à qui veut l'afficher en miroir — y compris pour ÉTAT, qui gère
     ses blocs lui-même mais n'a pas de raison de refuser son propre reflet. */
  if(d.__vueask&amp;&amp;e.source){
   try{ e.source.postMessage({__vueres:{id:d.__vueask.id, vue:VUEID, html:copieDeLaVue()}},'*'); }catch(_){}
   return;
  }
  if(d.__miroir){ MIROIR=d.__miroir.cles||[]; appliqueMiroir(); return; }
  if(d.__vueid===undefined || VUEID) return;
  VUEID=d.__vueid; VUELABEL=d.__vuelabel||d.__vueid;
  if(d.__miroircles){                          /* on est un reflet, pas la vue de travail */
   MIROIR=d.__miroircles; appliqueMiroir(); surveilleMiroir(); return;
  }
  if(VUEID==='admin') return;                  /* la vue qui affiche ne se publie pas elle-même */
  if(typeof window.__blocPret==='function') return;   /* vue déjà autonome (ÉTAT) : on s'efface */
  demarre();
 });
 function qui(){ try{ parent.postMessage({__whoami:1},'*'); }catch(_){} }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',qui); else qui();

 function copieDeLaVue(){

  var c=candidats();

  for(var i=0;i<a.length;i++){ if(a[i].id===id) pos=i; }
  if(pos>=0) a.splice(pos,1);

               publie_le:new Date().toISOString(), par:'Zeus'});
  pubEcrire(a);
  try{ if(typeof window.__pubSync==='function') window.__pubSync(a); }catch(_){}
  var m={__pubchange:{dom:DOMN}};
  try{ parent.postMessage(m,'*'); }catch(_){}
  try{ var fr=parent.frames; for(var j=0;j<fr.length;j++){ if(fr[j]!==window) fr[j].postMessage(m,'*'); } }catch(_){}
  oeils();
 }
 function oeils(){

      (function(cle){ o.addEventListener('click',function(ev){ ev.stopPropagation(); ev.preventDefault(); bascule(cle); }); })(c[i].cle);

 }

<script>

/* ---------- CARNET : la coque lit DATA_PERSO.json UNE fois et le diffuse aux vues ---------- */
var SRV="Google Drive", CARNET=null, CERR=null, CAT=null, CSRC=null;
var badge=document.getElementById('carnet');
function cPost(w){try{w.postMessage({__data:CARNET,__err:CERR,__at:CAT,__src:CSRC},'*')}catch(e){}}
function cDiffuse(){document.querySelectorAll('.vframe').forEach(function(f){if(f.contentWindow)cPost(f.contentWindow)});}
function cBadge(){
  if(!badge)return;
  /* 12/08 : quatre etats. « ✓ » tout court ne suffisait pas — un instantane embarque
     s'affichait en vert avec l'heure courante, et rien ne disait que RIEN n'avait ete lu. */
  if(CARNET&&(CSRC==='fichier'||CSRC==='drive'||CSRC==='coffre')){badge.className='carnet on';
    badge.textContent='carnet ✓ '+(CSRC==='coffre'?'coffre ':(CSRC==='fichier'?'fichier ':'Drive '))+(CAT?new Date(CAT).toLocaleTimeString('fr-FR'):'');
    badge.title='DATA_PERSO.json lu '+(CSRC==='fichier'?'à côté du cockpit':'sur le Drive')+' et diffusé à toutes les vues';}
  else if(CARNET){badge.className='carnet ko';
    badge.textContent='carnet ○ instantané embarqué';
    badge.title='Aucune lecture du fichier dans cette session'+(CERR?' ('+CERR+')':'')+
      ' — les chiffres viennent de l’instantané figé dans la page.';}
  else{badge.className='carnet ko';badge.textContent='carnet — figé';
    badge.title='Chiffres figés : '+(CERR||'?');}
}
/* Le repli : on montre l'instantane PLUTOT QUE RIEN, mais on le dit. */
function cRepli(code){
  if(window.__CARNET_DEMO__){CARNET=window.__CARNET_DEMO__;CSRC='snapshot';CERR=code||null;CAT=null;}
  else{CARNET=null;CSRC=null;CERR=code;CAT=null;}
  cBadge();cDiffuse();
}
function cFail(code){if(code==='server_unavailable'&&CARNET&&CSRC==='drive')return;cRepli(code);}
function cOk(d,at,src){CARNET=d;CSRC=src||'drive';CERR=null;CAT=at;cBadge();cDiffuse();}
function cParse(txt){
  if(typeof txt!=="string") return (txt&&txt.domaine)?txt:null;
  try{ return JSON.parse(txt); }catch(e){}
  try{ return JSON.parse(txt.replace(/\\([^"\\\/bfnrtu])/g,"$1")); }catch(e){}
  var i=txt.indexOf("{"), j=txt.lastIndexOf("}");
  if(i>=0&&j>i){ try{ return JSON.parse(txt.slice(i,j+1).replace(/\\([^"\\\/bfnrtu])/g,"$1")); }catch(e){} }
  return null;
}
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.__want==='data'&&e.source){cPost(e.source);return;}
  if(d.__mcp&&e.source){
    var q=d.__mcp, src=e.source;
    if(!window.claude||window.claude.mcp===undefined){
      try{src.postMessage({__mcperr:{id:q.id,code:'capability_disabled'}},'*')}catch(_){}
      return;
    }
    window.claude.mcp.callTool(SRV,q.tool,q.input,{cache:{staleTime:120000}})
      .then(function(r){try{src.postMessage({__mcpres:{id:q.id,payload:r.payload}},'*')}catch(_){}})
      .catch(function(er){try{src.postMessage({__mcperr:{id:q.id,code:(er&&er.code)||'upstream_error'}},'*')}catch(_){}});
  }
});
/* ORDRE DE LECTURE — 12/08, sur constat de Zeus : « les cockpits doivent refléter
   l'état actuel du dossier ». Ils ne le pouvaient pas.
     1. DATA_PERSO.json posé À CÔTÉ du cockpit — même origine, un simple fetch. Marche
        partout : dans l'appli GESTION sur GitHub Pages comme en local.
     2. le Drive via window.claude.mcp — n'existe QUE dans un artefact Claude. C'était
        l'UNIQUE chemin jusqu'ici, donc dans l'appli le cockpit tombait systématiquement
        sur capability_disabled et n'était jamais vivant nulle part.
     3. l'instantané embarqué, en repli, annoncé comme tel.
   L'instantané ne court-circuite plus rien : il s'affiche tout de suite pour ne pas
   laisser un écran vide, et se fait remplacer dès que le fichier répond. */
/* 2026-08-13, demande de Zeus : « que la vue lise le carnet DÈS qu'il y en a un
   nouveau ». La coque REPASSE donc demander le fichier toutes les 60 s, page
   ouverte. Elle ne rediffuse aux vues QUE si le texte a changé (comparaison du
   contenu, pas de l'heure) : un veilleur qui régénère à l'identique ne fait pas
   clignoter les vues, un carnet vraiment neuf les rafraîchit sans rechargement. */
/* 2026-08-13 (validé Zeus, 0 €) : 15 s + requête CONDITIONNELLE. On mémorise
   l'ETag ; au passage suivant on envoie If-None-Match — si rien n'a changé le
   serveur répond 304 en quelques octets au lieu des ~550 Ko. GitHub Pages le
   supporte ; le serveur local, lui, répond 200 → le repli reste la comparaison
   du texte. Résultat : plus réactif ET moins de data qu'avant. */
var cTxtPrec=null,cEtag=null;
/* ---------- LE COFFRE D'ABORD (2026-08-14) ------------------------------------------
   Le carnet etait pose A COTE du cockpit, dans un depot PUBLIC : la paie, la banque,
   l'URSSAF, lisibles par quiconque connaissait l'adresse. Il vit desormais dans R2,
   derriere le mot de passe de l'appli. On l'y demande EN PREMIER, par window.fkhLire
   (expose par l'appli GESTION). Si le coffre ne repond pas — vue ouverte hors de
   l'appli, pas connecte, R2 muet — on retombe sur le fichier voisin tant qu'il existe.
   Aucun ecran ne change, aucun lien ne change ; seul l'endroit du fichier change. */
function cCoffre(suite){
  var f=null; try{ f=window.top.fkhLire; }catch(e){}
  if(typeof f!=='function'){ return suite(); }        /* hors appli : ancien chemin */
  try{
    f('carnet/PERSO.json', function(res){
      if(!res||res.error||!res.ok||!res.texte){ return suite(); }
      var d=cParse(res.texte);
      if(!d){ return suite(); }
      CARNET=d; CERR=null; CAT=new Date().toISOString(); CSRC='coffre';
      cTxtPrec=res.texte; cBadge(); cDiffuse();
    });
  }catch(e){ suite(); }
}
function cFichier(rejoue){
  try{
    var opts={cache:'no-store'};
    if(rejoue&&cEtag)opts.headers={'If-None-Match':cEtag};
    fetch('DATA_PERSO.json?t='+Date.now(),opts)
      .then(function(r){
        if(r.status===304) return null;           /* rien de neuf : silence */
        if(!r.ok) throw 0;
        cEtag=r.headers.get('ETag')||cEtag;
        return r.text();
      })
      .then(function(t){
        if(t===null) return;
        if(rejoue&&t===cTxtPrec) return;          /* 200 mais identique : silence */
        var d=cParse(t); if(!d) throw 0;
        cTxtPrec=t; cOk(d, Date.now(), 'fichier');
      })
      .catch(function(){ if(!rejoue) cDrive(); });
  }catch(e){ if(!rejoue) cDrive(); }
}
/* 2026-08-14 — LA RELECTURE REPASSE PAR LE COFFRE, PAS PAR LE FICHIER.
   Bug vu par Zeus : le badge disait « coffre » puis « fichier » 9 secondes plus tard.
   La relecture automatique appelait cFichier directement — elle repassait donc par le
   chemin public. Depuis que ce fichier n'existe plus, elle aurait fini par afficher
   « carnet — figé » sur des chiffres pourtant frais. Cause racine : j'ai branche le
   coffre au DEMARRAGE et oublie la boucle de rafraichissement. */
setInterval(function(){ cCoffre(function(){ cFichier(true); }); },15000);
function cDrive(){
  if(!window.claude||window.claude.mcp===undefined){ cRepli('capability_disabled'); return; }
  window.claude.mcp.watchTool(SRV,"search_files",
    {query:"title contains 'DATA_PERSO'",pageSize:5,excludeContentSnippets:true},
    function(ev){
      if(ev.type==='error'){ cFail((ev.error&&ev.error.code)||'upstream_error'); return; }
      var p=ev.result&&ev.result.payload;
      var fs=(p&&p.files)||[];
      // pas d'outil "update" Drive -> une MAJ = nouveau fichier même titre. On prend le PLUS RÉCENT (newest-wins).
      var f=fs.slice().sort(function(a,b){return (b.modifiedTime||'').localeCompare(a.modifiedTime||'');})[0];
      if(!f){ cFail('__absent'); return; }
      window.claude.mcp.callTool(SRV,"read_file_content",{fileId:f.id},{cache:{staleTime:60000}})
        .then(function(res){
          var pp=res.payload, txt=(pp&&(pp.fileContent||pp.content))||pp;
          var dd=cParse(txt);
          if(!dd){ cFail('__illisible'); return; }
          cOk(dd, res.cache?res.cache.storedAt:Date.now());
        })
        .catch(function(er){ cFail((er&&er.code)||'upstream_error'); });
    },
    {refetchInterval:600000});
}
cRepli('__lecture');   /* de quoi afficher tout de suite, remplacé dès que la source répond */
cCoffre(function(){ cFichier(); });   /* le coffre d'abord, le fichier voisin en repli */
/* ---------- RÔLE (2026-08-13) : côté COQUE. Une seule source pour tous les cockpits ----------
   L'admin ne voit QUE la vue « Administratif » : les autres onglets disparaissent et la vue
   est forcée. Le rôle arrive par ?role= (test), par le localStorage, ou par un message de
   l'hôte (index.html) quand le cockpit y est encastré. Une vue le RÉCLAME (__wantrole) au
   lieu d'espérer avoir été chargée au moment de la diffusion — même leçon que le carnet.
   Ce n'est pas un secret : le vrai verrou est côté appli GESTION (mot de passe → rôle) ;
   ici c'est la surface qu'on présente. */
var ROLE=null;
function diffuseRole(w){try{w.postMessage({__role:ROLE},'*')}catch(e){}}
function appliqueRole(r){
  ROLE=r||null; var admin=(ROLE==='admin');
  document.querySelectorAll('.tab').forEach(function(t){t.style.display=(admin&&t.dataset.v!=='admin')?'none':'';});
  var b=document.getElementById('rolebadge'); if(b){b.style.display=admin?'inline-block':'none';}
  document.querySelectorAll('.vframe').forEach(function(f){if(f.contentWindow)diffuseRole(f.contentWindow);});
  if(admin&&document.getElementById('if-admin')&&typeof showV==='function')showV('admin');
}
(function(){
  var m=/[?&]role=([a-z-]+)/.exec(location.search), s=null;
  try{s=localStorage.getItem('fkh_role_domaines');}catch(e){}
  if(m)appliqueRole(m[1]); else if(s)appliqueRole(s);
  window.addEventListener('message',function(e){var d=e.data||{};
    if(d.__wantrole&&e.source){diffuseRole(e.source);}
    if(d.__role!==undefined&&window.parent!==window&&e.source===window.parent){appliqueRole(d.__role);}
    /* « qui suis-je ? » — une vue empaquetée ne connaît pas son propre identifiant.
       La coque, elle, le sait : elle retrouve l'iframe qui parle et lui répond. Sans ça
       une vue ne peut pas se désigner dans une publication (pointeur vue+clé). */
    if(d.__whoami&&e.source){
      var el=null;
      document.querySelectorAll('.vframe').forEach(function(f){if(f.contentWindow===e.source)el=f;});
      if(el){var vid=el.id.replace(/^if-/,''),t=document.querySelector('.tab[data-v="'+vid+'"]');
        try{e.source.postMessage({__vueid:vid,__vuelabel:(t?t.textContent:vid)},'*');}catch(_){}}
    }
  });
})();
