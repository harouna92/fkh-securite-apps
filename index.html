<title>FKH SÉCURITÉ — Applications</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef1f5;--panel:#fff;--line:#d3d9e3;--ink:#141922;--muted:#5c6473;--brand:#2456c7;--brand-ink:#fff;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0c1017;--panel:#151b26;--line:#2a3444;--ink:#e8ecf3;--muted:#94a0b3;--brand:#5b8bff;--brand-ink:#0c1017}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:26rem;width:100%;display:flex;flex-direction:column;gap:16px}
.brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:4px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}
a.app{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;color:var(--ink)}
a.app .t{font-weight:700;font-size:18px}
a.app .d{font-size:13px;color:var(--muted);margin-top:4px}
a.app .e{font-size:30px;float:right;margin-left:12px}
.foot{text-align:center;font-size:11.5px;color:var(--muted)}
</style>
<div class="wrap">
