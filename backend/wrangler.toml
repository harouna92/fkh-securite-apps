name = "fkh-gestion-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# La base D1 partagée. `database_id` est rempli après `wrangler d1 create` (voir DEPLOY.md).
[[d1_databases]]
binding = "DB"
database_name = "fkh-gestion"
database_id = "1533502f-2761-4563-9a7f-ff1e6456229d"

# Stockage des photos (tenues, prise/fin de service, contrôles). Bucket créé dans le dashboard R2.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "fkh-tenues-photos"

# IA : scan automatique des appels entrants toutes les 2 minutes (détection demandes de gardiennage)
[triggers]
crons = ["* * * * *"]   # b327 : passage a chaque minute (Zeus 05/08) — le nombre d analyses ne change pas, seul le delai d attente du prochain passage diminue
