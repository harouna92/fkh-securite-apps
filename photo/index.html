<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FKH Sécurité — Photo</title>
<style>
  :root{--bg:#0f1420;--panel:#1c2230;--line:#334;--ink:#e8eefc;--muted:#8aa;--ok:#137a3b;--bad:#c02626;--accent:#6ea8fe;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:14px}
  h1{font-size:18px;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 10px}
  .badge{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;margin:4px 6px 4px 0}
  video,canvas,#preview img{width:100%;max-height:46vh;object-fit:cover;border-radius:14px;background:#000;display:block}
  .btn{width:100%;padding:15px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;margin-top:10px}
  .btn.ok{background:var(--ok);border-color:var(--ok)}
  .btn.snap{background:var(--accent);border-color:var(--accent);color:#04122b}
  /* Barre de capture toujours visible en bas, sans avoir à scroller */
  #cam-actions{position:sticky;bottom:0;background:var(--bg);padding:8px 0 6px;z-index:5;box-shadow:0 -8px 12px -6px var(--bg)}
  #done{display:none;text-align:center;padding:30px 10px}
  #done .big-ok{font-size:44px;margin-bottom:6px}
  #msg{margin-top:12px;font-weight:600;text-align:center;min-height:22px}
  .err{color:var(--bad)} .good{color:#41d67f}
</style>
</head>
<body>
<div class="wrap">
  <h1>📸 FKH Sécurité</h1>
  <p class="sub">Prends la photo demandée. Elle est horodatée automatiquement et envoyée à l'agence.</p>
  <div id="geowarn" style="display:none;background:rgba(200,0,0,.14);border:1.5px solid #c02626;color:#ff8f8f;border-radius:10px;padding:9px 10px;margin:0 0 8px;font-size:13px;line-height:1.45"><b>📍 Localisation non détectée</b><br>Active-la pour que ta photo compte comme preuve de présence sur le site.<div style="margin-top:6px"><button type="button" id="geo-retry" style="font-size:12px;padding:6px 10px">🔄 Réessayer la position</button></div></div><div id="ctx"></div>
  <video id="v" autoplay playsinline muted></video>
  <canvas id="c" style="display:none"></canvas>
  <div id="preview" style="display:none"></div>
  <div id="cam-actions">
    <button class="btn snap" id="snap">📷 Prendre la photo</button>
    <button class="btn" id="cam-flip" style="margin-top:8px;background:#243447;color:#dbe6f3">🤳 Passer en selfie</button>
    <button class="btn ok" id="send" style="display:none">✅ Envoyer à l'agence</button>
    <button class="btn" id="retry" style="display:none">🔄 Reprendre</button>
    <div id="msg"></div>
  </div>
  <div id="done"><div class="big-ok">✅</div><div style="font-size:18px;font-weight:700">Photo envoyée à l'agence</div><p class="sub" style="margin-top:8px">Merci ! Vous pouvez fermer cette page.</p></div>
</div>
<script>
(function(){
  var API='https://fkh-gestion-api.hacamara2.workers.dev';
  var TOKEN='fkh-photo-link-2026';
  var q=new URLSearchParams(location.search);
  // Lien permanent par agent : aid = identifiant fiche agent ; name = son nom. Pas de type (l'agence déduit l'étape via l'horodatage).
  var aid=(q.get('aid')||'').trim();
  // Lien UNIQUE pour tous les agents (u=1) : pas d'identité dans le lien ni sur le tampon — l'agence rapproche la photo d'une vacation via l'heure + la ville (GPS).
  var uni=(q.get('u')||'').trim();
  var agent=(q.get('name')||q.get('a')||'').trim(), type=(q.get('t')||((aid||uni)?'':'prise')).trim(), mid=(q.get('m')||'').trim(), site=(q.get('s')||'').trim();
  var TYPES={prise:'🟢 Prise de service',fin:'🔚 Fin de service',tenue:'🦺 Contrôle tenue',controle:'🎛️ Contrôle pendant service'};
  var v=document.getElementById('v'), c=document.getElementById('c'), snap=document.getElementById('snap'), send=document.getElementById('send'), retry=document.getElementById('retry'), msg=document.getElementById('msg'), prev=document.getElementById('preview');
  document.getElementById('ctx').innerHTML=(type?'<span class="badge">'+(TYPES[type]||type)+'</span>':'')+(agent?'<span class="badge">👤 '+esc(agent)+'</span>':'')+(site?'<span class="badge">📍 '+esc(site)+'</span>':'');
  if(aid||uni)msg.innerHTML='<span style="color:#8aa">Photo horodatée automatiquement (date, heure, position). Prends-la au moment du service.</span>';
  if(type==='tenue')msg.innerHTML='<span style="color:#e0a13b">🦺 Cadre bien l\'AGENT en tenue (pas le bâtiment).</span>';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
  function pad(n){return (n<10?'0':'')+n;}
  var stream=null;
  var camErreur=function(err){ /* b216 : diagnostic precis + solution de secours */ var n=(err&&err.name)||'', t=''; if(n==='NotAllowedError'||n==='SecurityError'){ t='🚫 Accès caméra REFUSÉ.<br>Touche le cadenas 🔒 en haut de l’écran → Autorisations → Caméra → Autoriser, puis recharge la page.'; } else if(n==='NotReadableError'||n==='AbortError'||n==='TrackStartError'){ t='📵 La caméra est OCCUPÉE par autre chose — le plus souvent un <b>appel téléphonique en cours</b> ou une autre application.<br>Termine l’appel (ou ferme l’autre appli), puis recharge la page.'; } else if(n==='NotFoundError'){ t='⚠️ Aucune caméra détectée sur cet appareil.'; } else { t='⚠️ Caméra indisponible ('+(n||'erreur')+').'; } msg.className='err'; msg.innerHTML=t+'<div style="margin-top:12px"><label class="btn" style="cursor:pointer;display:inline-block;padding:12px 16px;font-size:16px;background:#1a9e5c;color:#fff;border-radius:10px">📷 Prendre la photo avec l’appareil photo<input type="file" accept="image/*" capture="environment" id="cam-fb" style="display:none"></label><div style="font-size:12px;margin-top:6px;opacity:.85">Solution de secours : la photo sera tamponnée de la même façon.</div></div>'; snap.style.display='none'; var fb=document.getElementById('cam-fb'); if(fb)fb.onchange=function(){ var f=fb.files&&fb.files[0]; if(!f)return;   var im=new Image();   im.onload=function(){ try{ var W=im.naturalWidth,H=im.naturalHeight; c.width=W; c.height=H; var x=c.getContext('2d'); x.drawImage(im,0,0,W,H); stampCanvas(); }catch(e){} };   im.src=URL.createObjectURL(f); }; };
  /* b244 (remontee #67) : un agent ne peut pas se photographier lui-meme avec la camera arriere.
     Pour le controle de tenue, la camera avant est le seul moyen — d'ou la bascule. On se souvient du
     choix : un controle de tenue rouvre directement en selfie. */
  var camFace=(type==='tenue')?'user':'environment';
  try{ var _mem=localStorage.getItem('fkh_cam_face_'+(type||'x')); if(_mem)camFace=_mem; }catch(e){}
  function camDemarrer(){
    try{ if(stream)stream.getTracks().forEach(function(t){t.stop();}); }catch(e){}
    navigator.mediaDevices.getUserMedia({video:{facingMode:camFace,width:{ideal:2560},height:{ideal:1440}},audio:false})
      .then(function(s2){ stream=s2; v.srcObject=s2;
        /* en selfie on affiche l'image en miroir : sinon l'agent se voit a l'envers et se cadre mal.
           La photo enregistree, elle, n'est PAS miroir — un ecusson doit rester lisible. */
        v.style.transform=(camFace==='user')?'scaleX(-1)':'';
        var fb=document.getElementById('cam-flip');
        if(fb)fb.textContent=(camFace==='user')?'🏢 Repasser en caméra arrière':'🤳 Passer en selfie';
      })
      .catch(function(err){ camErreur(err); });
  }
  (function(){ var fb=document.getElementById('cam-flip'); if(!fb)return;
    fb.onclick=function(){ camFace=(camFace==='user')?'environment':'user';
      try{ localStorage.setItem('fkh_cam_face_'+(type||'x'),camFace); }catch(e){}
      camDemarrer(); };
  })();
  camDemarrer();
  var gpsCity='', gpsStreet='', gpsCoord='', gpsCp=''; // b209 : code postal
  function geoWarn(on){ var w=document.getElementById('geowarn'); if(w)w.style.display=on?'block':'none'; }
  function geoAsk(){ if(!navigator.geolocation){ geoWarn(true); return; } navigator.geolocation.getCurrentPosition(function(p){ gpsCoord=p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5); fetch('https://api-adresse.data.gouv.fr/reverse/?lon='+p.coords.longitude+'&lat='+p.coords.latitude).then(function(r){return r.json();}).then(function(j){ var f=j&&j.features&&j.features[0]; if(f){ gpsCity=f.properties.city||f.properties.municipality||''; gpsStreet=f.properties.name||f.properties.street||''; gpsCp=f.properties.postcode||''; /* b209 */ var el=document.getElementById('ctx'); if(el&&gpsCity)el.innerHTML+='<span class="badge">📍 '+esc((gpsStreet?gpsStreet+', ':'')+(gpsCp?gpsCp+' ':'')+gpsCity)+'</span>'; } }).catch(function(){}); geoWarn(false); }, function(){ geoWarn(true); }, {enableHighAccuracy:true,timeout:8000,maximumAge:60000}); }
  geoWarn(true); geoAsk(); /* b215 : bandeau tant que la position n'est pas obtenue */
  (function(){ var b=document.getElementById('geo-retry'); if(b)b.onclick=function(){ b.textContent='⏳ Recherche…'; geoAsk(); setTimeout(function(){ b.textContent='🔄 Réessayer la position'; },2500); }; })();
  var blob=null;
  function stampCanvas(){ var x=c.getContext('2d'); var W=c.width, H=c.height;
    // tampon horodaté en bas
    var d=new Date(); var stamp=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    var line2=uni?'':(aid?(agent||''):((agent?agent+' · ':'')+(TYPES[type]||type||'').replace(/^[^ ]+ /,'')));
    var line3=(gpsCity||gpsCoord)?('📍 '+(gpsStreet?gpsStreet+', ':'')+(gpsCp?gpsCp+' ':'')+(gpsCity||'')+(gpsCoord?((gpsCity?' · ':'')+'GPS '+gpsCoord):'')):''; // b173 : coordonnees GPS imprimees sur le tampon
    var fs=Math.max(16,Math.round(W/32)); x.font='bold '+fs+'px system-ui,sans-serif'; x.textBaseline='bottom';
    var nl=1+(line2?1:0)+(line3?1:0), bh=fs*(nl*1.25+0.5); x.fillStyle='rgba(0,0,0,.55)'; x.fillRect(0,H-bh,W,bh);
    x.fillStyle='#fff'; var yy=H-6; if(line3){ x.fillText(line3, 12, yy); yy-=fs*1.25; } if(line2){ x.fillText(line2, 12, yy); yy-=fs*1.25; } x.fillText('🕐 '+stamp, 12, yy);
    c.toBlob(function(b){ blob=b; prev.innerHTML='<img src="'+URL.createObjectURL(b)+'">'; prev.style.display='block'; v.style.display='none'; snap.style.display='none'; send.style.display='block'; retry.style.display='block'; msg.textContent=''; },'image/jpeg',0.88);
  }
  snap.onclick=function(){ var W=v.videoWidth, H=v.videoHeight; c.width=W; c.height=H; var x=c.getContext('2d'); x.drawImage(v,0,0,W,H); stampCanvas(); };
  retry.onclick=function(){ blob=null; prev.style.display='none'; v.style.display='block'; snap.style.display='block'; send.style.display='none'; retry.style.display='none'; msg.textContent=''; };
  send.onclick=function(){
    if(!blob){ return; }
    send.disabled=true; send.textContent='⏳ Envoi…'; msg.className=''; msg.textContent='';
    var safe=(agent||'agent').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'').toLowerCase()||'agent';
    var citySlug=(gpsCity||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'').toLowerCase()||'ville_inconnue';
    var base = mid ? ('appel/'+mid+'/'+(type==='controle'?'ctrl':type)) : (uni ? ('u/'+citySlug) : (aid ? ('agent/'+aid+'/'+citySlug) : ('agent/'+type+'/'+safe+'/'+citySlug)));
    var key = base+'/'+Date.now()+'.jpg';
    fetch(API+'/agent-photo?k='+encodeURIComponent(TOKEN)+'&key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob}).then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok){ if(stream)stream.getTracks().forEach(function(t){t.stop();}); v.style.display='none'; prev.style.display='none'; document.getElementById('cam-actions').style.display='none'; document.getElementById('ctx').style.display='none'; document.getElementById('done').style.display='block'; setTimeout(function(){ try{ window.close(); }catch(e){} },1200); }
      else { send.disabled=false; send.textContent='✅ Envoyer à l\'agence'; msg.className='err'; msg.textContent='Échec : '+((j&&j.error)||'réessaie'); }
    }).catch(function(){ send.disabled=false; send.textContent='✅ Envoyer à l\'agence'; msg.className='err'; msg.textContent='Réseau indisponible, réessaie.'; });
  };
})();
</script>
</body>
</html>
